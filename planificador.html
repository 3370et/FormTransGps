<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:'DM Sans',sans-serif;background:#08090d;color:#e4e8f1;overflow:hidden;display:flex;flex-direction:column}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0e1018}
    ::-webkit-scrollbar-thumb{background:#22273a;border-radius:2px}
    #topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#0e1018;border-bottom:1px solid #22273a;flex-shrink:0;flex-wrap:wrap;z-index:1200}
    .tb-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-right:6px}
    .tb-title i{color:#e8913a}
    .tb-fecha{background:#14171f;border:1px solid #22273a;color:#e4e8f1;border-radius:8px;padding:7px 10px;font-family:'DM Sans',sans-serif;font-size:12px;color-scheme:dark}
    .tb-btn{padding:7px 12px;border-radius:8px;border:1px solid #22273a;background:#14171f;color:#8891a8;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
    .tb-btn:hover{border-color:#e8913a;color:#e8913a}
    .tb-btn.primary{border-color:rgba(232,145,58,.5);color:#e8913a;background:rgba(232,145,58,.08)}
    .tb-btn.primary:hover{background:rgba(232,145,58,.16)}
    .tb-btn:disabled{opacity:.4;cursor:not-allowed}
    .chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
    .c-h{background:rgba(255,209,102,.1);color:#ffd166;border:1px solid rgba(255,209,102,.25)}
    .c-pt{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
    #chipPP{padding:6px 10px;white-space:nowrap}
    #demo{display:none;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.3);color:#ffd166;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px}
    #estado{font-size:11px;color:#8891a8;margin-left:auto;display:flex;align-items:center;gap:6px}
    #estado.err{color:#f87171}
    #estado.busy i{animation:girar 1s linear infinite}
    @keyframes girar{to{transform:rotate(360deg)}}
    #main{flex:1;display:flex;min-height:0}
    #sidebar{width:720px;min-width:720px;background:#0e1018;border-right:1px solid #22273a;display:flex;flex-direction:column;height:100%;transition:transform .3s ease}
    #sidebar.hidden{transform:translateX(-100%);min-width:0;width:0;overflow:hidden}
    @media(max-width:1100px){
      #sidebar{width:348px;min-width:348px}
    }
    .sb-head{padding:12px 14px 8px;border-bottom:1px solid #22273a;flex-shrink:0}
    .sb-head h2{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
    .sb-head h2 i{color:#e8913a;font-size:12px}
    .sb-chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
    .c-tr{background:rgba(232,145,58,.1);color:#e8913a;border:1px solid rgba(232,145,58,.2)}
    .c-kg{background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.2)}
    .c-km{background:rgba(167,139,250,.1);color:#a78bfa;border:1px solid rgba(167,139,250,.2)}
    .sb-btns{display:flex;gap:6px;margin-top:7px}
    .sb-btn-fit{flex:1;padding:6px;border-radius:8px;border:1px solid #22273a;background:#14171f;color:#8891a8;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
    .sb-btn-fit:hover{border-color:#e8913a;color:#e8913a}
    .sb-btn-fit.on{border-color:rgba(232,145,58,.4);color:#e8913a;background:rgba(232,145,58,.08)}
    #alertas{display:none;margin:8px;padding:7px 10px;border-radius:8px;background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);font-size:10.5px;color:#fca5a5;max-height:80px;overflow-y:auto;flex-shrink:0}
    #alertas div{margin-bottom:2px;line-height:1.35}
    .sb-list{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:6px;align-content:start}
    .sb-plan{display:flex;align-items:stretch;border-radius:9px;overflow:hidden;border:1px solid #22273a;background:#14171f;cursor:pointer;transition:border-color .2s;min-width:0}
    .sb-plan:hover{border-color:#333a52}
    .sb-plan.open{grid-column:1 / -1}
    .sb-bar{width:5px;flex-shrink:0}
    .sb-content{flex:1;padding:8px 10px;min-width:0}
    .sb-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
    .sb-codigo{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sb-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;flex-shrink:0;white-space:nowrap}

    .bd{background:rgba(255,209,102,.1);color:#ffd166;border:1px solid rgba(255,209,102,.25)}
    .sb-meta{font-size:10.5px;color:#565e74;margin-top:4px}
    .sb-meta i{font-size:9.5px;margin:0 3px 0 0}
    .sb-veh{margin-top:6px;display:flex;align-items:center;gap:6px;background:#0e1018;border:1px solid #22273a;border-radius:8px;padding:4px 7px}
    .sb-veh:hover{border-color:#e8913a}
    .veh-lbl{font-size:9px;font-weight:800;color:#e8913a;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;display:flex;align-items:center;gap:4px}
    .veh-lbl i{font-size:10px}
    .veh-sel{flex:1;background:transparent;border:none;color:#e4e8f1;font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:700;color-scheme:dark;cursor:pointer;outline:none;min-width:0}
    .veh-sel:hover,.veh-sel:focus{color:#e8913a}
    .veh-sel option{background:#14171f;color:#e4e8f1}
    .sb-paradas{display:none;margin-top:8px;border-top:1px solid #22273a;padding-top:6px;columns:2;column-gap:12px}

    .sb-parada{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:7px;cursor:pointer;break-inside:avoid}
    .sb-parada:hover{background:#191d28}
    .sp-num{width:19px;height:19px;border-radius:50%;color:#0b0d12;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sp-body{min-width:0}
    .sp-nombre{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sp-meta{font-size:9.5px;color:#565e74}
    .sb-eye{width:26px;display:flex;align-items:center;justify-content:center;color:#565e74;font-size:10px;cursor:pointer;transition:color .2s;border:none;background:none;flex-shrink:0}
    .sb-eye:hover{color:#e4e8f1}
    .sb-eye.off{color:#2a2f40}
    #map{flex:1;min-width:0;z-index:1}
    .leaflet-container{background:#08090d !important}
    #sbToggle{position:fixed;top:12px;left:12px;z-index:1100;width:36px;height:36px;border-radius:10px;border:1px solid #22273a;background:rgba(14,16,24,.92);backdrop-filter:blur(8px);color:#8891a8;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
    #sbToggle:hover{border-color:#e8913a;color:#e8913a}
    .mk{background:none !important;border:none !important}
    .mk-dot{width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .2s;cursor:pointer}
    .mk-dot:hover{transform:scale(1.25)}
    .mk-dot.hl{transform:scale(1.3);box-shadow:0 0 0 4px rgba(255,255,255,.25)}
    .mk-dep{width:34px;height:34px;border-radius:50%;background:#fff;color:#b45309;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid #ffd166;box-shadow:0 2px 10px rgba(0,0,0,.5)}
    .lbl-sector{background:rgba(14,16,24,.82) !important;border:1px solid #22273a !important;color:#8891a8 !important;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:600;padding:1px 6px !important;border-radius:5px !important;box-shadow:none !important}
    .lbl-sector::before{display:none !important}
    .sin-etiquetas .lbl-sector{display:none}
    .zoom-lejos .lbl-sector{display:none}
    .leaflet-popup-content-wrapper{background:#14171f !important;color:#e4e8f1 !important;border:1px solid #22273a !important;border-radius:12px !important;box-shadow:0 8px 28px rgba(0,0,0,.5) !important}
    .leaflet-popup-tip{background:#14171f !important;border:1px solid #22273a !important}
    .leaflet-popup-close-button{color:#565e74 !important}
    .pp{padding:12px 14px;min-width:200px}
    .pp-num{font-size:9px;color:#565e74;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
    .pp-nombre{font-size:14px;font-weight:700;margin-bottom:6px;line-height:1.3}
    .pp-row{display:flex;align-items:center;gap:5px;font-size:11px;color:#8891a8;margin-bottom:2px;flex-wrap:wrap}
    .pp-row i{width:13px;text-align:center;font-size:9px;color:#565e74;flex-shrink:0}
    .pp-coord{font-family:'Space Grotesk',monospace;font-size:10px;color:#565e74;margin-top:5px;padding-top:5px;border-top:1px solid #22273a}
    @media(max-width:768px){
      #sidebar{position:fixed;left:0;top:0;height:100vh;z-index:1150;box-shadow:8px 0 32px rgba(0,0,0,.5);width:100vw;min-width:100vw}
      #sidebar.hidden{transform:translateX(-100%)}
    }
  </style>
</head>
<body>
  <button id="sbToggle" onclick="document.getElementById('sidebar').classList.toggle('hidden')" title="Mostrar/ocultar panel de rutas"><i class="fa-solid fa-bars"></i></button>

  <header id="topbar">
    <span class="tb-title"><i class="fa-solid fa-route"></i> Planificador de entregas</span>
    <input type="date" id="inpFecha" class="tb-fecha" title="Fecha de carga de datos en rutas/{fecha} (víspera). El despacho y el pico y placa se evalúan al DÍA SIGUIENTE.">
    <span id="chipPP" class="chip c-h"></span>
    <button class="tb-btn primary" id="btnGen" onclick="generar()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generar plan</button>
    <button class="tb-btn" id="btnSave" onclick="guardarPlan()" disabled><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
    <button class="tb-btn" id="btnCopy" onclick="copiarJSON()" disabled><i class="fa-solid fa-copy"></i> JSON</button>
    <span id="demo"><i class="fa-solid fa-triangle-exclamation"></i> DEMO sin Firebase</span>
    <span id="estado"></span>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="sb-head">
        <h2><i class="fa-solid fa-truck-fast"></i> <span id="sbTitulo">Plan</span></h2>
        <div class="sb-chips" id="sbChips"></div>
        <div class="sb-btns">
          <button class="sb-btn-fit" onclick="fitAll()"><i class="fa-solid fa-expand"></i> Ajustar vista</button>
          <button class="sb-btn-fit on" id="btnEtiquetas" onclick="toggleEtiquetas()"><i class="fa-solid fa-tags"></i> Sectores</button>
        </div>
      </div>
      <div id="alertas"></div>
      <div class="sb-list" id="sbList"></div>
    </aside>
    <div id="map"></div>
  </div>

  <script>
    /* =====================================================================
       PLANIFICADOR DE ENTREGAS v3.5
       Estructura Firebase:
         raiz/codigosUsados/{fecha}/{codRuta}/datosFormulario/{idx}  ← historial
         raiz/rutas/deposito                                          ← salida (typo "lat:" manejado)
         raiz/rutas/{fecha}/{items con codc}                          ← a planificar
         raiz/rutas/{fecha}/plan                                      ← plan guardado
       ★ MODELO DE FECHAS (v3.5):
         - rutas/{D} se carga la VÍSPERA; el despacho real es D+1
         - El PICO Y PLACA se evalúa en D+1 (fecha de despacho)
         - El plan se guarda en rutas/{D}/plan con fechaDespacho: D+1
         - Historial: codigosUsados con fecha <= D (capturas de la víspera
           incluidas: son el despacho más reciente)
       Reglas de negocio:
         - Orden de entrega real = momento de captura GPS
         - Capacidad única 3 t por vehículo
         - Cliente > 3 t = vehículo dedicado con N viajes al mismo punto
         - Hora local del navegador (Ecuador)
       PICO Y PLACA (Quito), según la FECHA DE DESPACHO (D+1):
         Lunes 1-2 · Martes 3-4 · Miércoles 5-6 · Jueves 7-8 · Viernes 9-0
         Sábado: media flota sin restricción · Domingo: sin restricción
       Asignación de vehículos reales:
         1º camión habitual del historial → 2º mayor capacidad disponible
         + reasignación manual por select (etiqueta CAMIÓN) con intercambio
       ===================================================================== */

    /* ================= CONFIGURACIÓN ================= */
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyCrnroA2yd2coEVyn6Jm-q8sM6rvOb6Y3k", authDomain: "datos-formulario-f3cde.firebaseapp.com", databaseURL: "https://datos-formulario-f3cde-default-rtdb.firebaseio.com",   /* ← COMPLETAR (databaseURL obligatoria) */
      projectId: "datos-formulario-f3cde", storageBucket: "datos-formulario-f3cde.firebasestorage.app", messagingSenderId: "1060204671476", appId: "1:1060204671476:web:a476539fa122fd04fa89a1"
    };

    var CAP_KG = 3000; /* capacidad única por vehículo: 3 toneladas */
    var PU = { vKmH: 25, atenMinDef: 8, atenMaxMin: 30, wHist: 0.9, wVentana: 30, diasHist: 30 };
    var PALETA = ['#e8913a','#34d399','#60a5fa','#a78bfa','#f472b6','#fbbf24','#2dd4bf','#f87171','#a3e635','#38bdf8','#fb923c','#4ade80'];

    /* Override manual para clientes sin GPS válido (prioridad máxima).
       Ej: 'PN0001799': { lat: -0.7012, lon: -78.4455 } */
    var COORDS_MANUALES = { };

    /* ================= FLOTA (nombres oficiales) ================= */
    var FLOTA = [
      { cod:'101',  nom:'ALMEIDA JULIO 1',        placa:'FAC5418', c1:352, c2:50,  c3:4    },
      { cod:'141',  nom:'ALMEIDA JULIO 2',        placa:'FAC5512', c1:308, c2:50,  c3:5    },
      { cod:'106',  nom:'ALTAMIRANO CE',          placa:'PAA3936', c1:352, c2:85,  c3:10   },
      { cod:'187',  nom:'ARTEAGA DIANA',          placa:'NAA0036', c1:352, c2:85,  c3:10   },
      { cod:'127',  nom:'ARTEAGA SUSANA. (CA)',   placa:'PFH5919', c1:24,  c2:0,   c3:0.6  },
      { cod:'105',  nom:'BOSQUE LUIS (CA)',       placa:'PAA3836', c1:343, c2:16,  c3:7.5  },
      { cod:'144',  nom:'CARDENAS DAN',           placa:'GSO165',  c1:420, c2:85,  c3:12   },
      { cod:'123',  nom:'CHACON FREDDY',          placa:'FZQ0863', c1:352, c2:85,  c3:10   },
      { cod:'107',  nom:'DUCHAN JAVIER',          placa:'FAC2514', c1:355, c2:85,  c3:10   },
      { cod:'119',  nom:'DELA CRUZ JOR',          placa:'PCN3220', c1:245, c2:16,  c3:6    },
      { cod:'102',  nom:'ESPARZA CRIST',          placa:'FFU5620', c1:180, c2:20,  c3:2.5  },
      { cod:'109',  nom:'FONSECA DORIS',          placa:'PAE8641', c1:280, c2:50,  c3:6    },
      { cod:'103',  nom:'GUIZMAN MAURI',          placa:'PAC3588', c1:280, c2:20,  c3:5    },
      { cod:'112',  nom:'JARA ANGEL 1',           placa:'PBE3739', c1:280, c2:20,  c3:5    },
      { cod:'129',  nom:'JARA ANGEL 2',           placa:'PAE3616', c1:350, c2:50,  c3:7.5  },
      { cod:'126',  nom:'JARA JOSE LUIS',         placa:'PBM9525', c1:245, c2:12,  c3:5    },
      { cod:'143',  nom:'NUÑEZ ORLANDO',          placa:'PCE6642', c1:280, c2:12,  c3:6    },
      { cod:'115',  nom:'ORELLANA JOEL',          placa:'KAA8521', c1:350, c2:80,  c3:7.5  },
      { cod:'176',  nom:'ORELLANA SANTIAGO',      placa:'PCP3630', c1:352, c2:85,  c3:10   },
      { cod:'182',  nom:'QUISTAL PATRICIO',       placa:'PFU3086', c1:198, c2:16,  c3:3.5  },
      { cod:'118',  nom:'RIVADENEIRA CRISTIAN',   placa:'PAE6318', c1:245, c2:12,  c3:5    },
      { cod:'172',  nom:'SANCHEZ LEONARDO',       placa:'PAC3726', c1:null,c2:null,c3:5    },
      { cod:'121',  nom:'TACIPANATA SANDRA',      placa:'PAE1463', c1:406, c2:null,c3:10   },
      { cod:'120',  nom:'ZARATE JEFFERSON',       placa:'TDH0432', c1:null,c2:80,  c3:12   }
    ];

    /* ★ SÁBADO: media flota sin restricción de pico y placa.
       Completa con los CÓDIGOS de los camiones que trabajan sábado.
       Si queda vacío [], el sábado usa toda la flota (sin filtro). */
    var FLOTA_SABADO = [ /* ej: ['101','119','176','144'] */ ];

    var DIAS_SEM = ['Domingo','Lunes','Martes','Mi\u00e9rcoles','Jueves','Viernes','S\u00e1bado'];
    /* Quito: Lunes 1-2, Martes 3-4, Miércoles 5-6, Jueves 7-8, Viernes 9-0.
       Sábado (6) y domingo (0): sin restricción (digitos = null). */
    var PP_MAPA = { 1:[1,2], 2:[3,4], 3:[5,6], 4:[7,8], 5:[9,0] };

    /* ================= FIREBASE + AUTH ANÓNIMA ================= */
    var FB_OK = !!(FIREBASE_CONFIG.databaseURL);
    var db = null;
    if (FB_OK) {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        /* ★ sesión anónima: satisface reglas auth != null (persistente entre recargas) */
        firebase.auth().signInAnonymously().catch(function(e) { console.error('Auth:', e.message); });
        db = firebase.database();
      } catch (e) { FB_OK = false; }
    }
    /* ★ espera a que la sesión anónima exista antes de leer/escribir */
    function esperarAuth() {
      return new Promise(function(resolve) {
        if (!FB_OK) return resolve(false);
        if (firebase.auth().currentUser) return resolve(true);
        var off = firebase.auth().onAuthStateChanged(function(u) { if (u) { off(); resolve(true); } });
      });
    }

    /* ================= UTILIDADES ================= */
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function havKm(a,b){ var al=(a.lng!=null)?a.lng:a.lon, bl=(b.lng!=null)?b.lng:b.lon;
      var dLa=(b.lat-a.lat)*Math.PI/180, dLo=(bl-al)*Math.PI/180;
      var s=Math.pow(Math.sin(dLa/2),2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.pow(Math.sin(dLo/2),2);
      return 2*6371*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)); }
    function hhmm2min(s){ var m=/^(\d{1,2}):(\d{2})/.exec(String(s||'').trim()); return m?(+m[1])*60+(+m[2]):null; }
    function ventana(h){ if(!h) return null; var p=String(h).split(/[-aA]/).map(hhmm2min); return (p.length===2&&p[0]!=null&&p[1]!=null)?p:null; }
    function fmtMin(m){ if(m==null) return ''; m=Math.round(m); var h=Math.floor(m/60)%24, mm=m%60; return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm; }
    function prom(a){ return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null; }
    function pad2(n){ return (n<10?'0':'')+n; }
    function round6(v){ return Math.round(v*1e6)/1e6; }
    function fmtKg(n){ return Math.round(n).toLocaleString('es-EC'); }
    function objVals(o){ return Object.keys(o).map(function(k){ return o[k]; }); }
    function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
    function mananaISO(){ return sumarDiasISO(hoyISO(), 1); }
    function fechaCortaPP(iso){ return iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : ''; }
    /* ★ v3.5: suma N días a una fecha ISO (T12:00 local evita salto de zona) */
    function sumarDiasISO(fechaISO, n) {
      if (!fechaISO || !/^\d{4}-\d{2}-\d{2}$/.test(fechaISO)) return fechaISO;
      var d = new Date(fechaISO + 'T12:00:00');
      d.setDate(d.getDate() + n);
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    function estado(msg,busy,err){ var el=document.getElementById('estado'); el.className=err?'err':(busy?'busy':''); el.innerHTML=(busy?'<i class="fa-solid fa-circle-notch"></i>':'')+esc(msg); }

    /* ================= PICO Y PLACA + FLOTA DEL DÍA ================= */
    /* ★ P&P del día de la FECHA DE DESPACHO (datos + 1). */
    function picoYPlaca(fechaISO) {
      if (!fechaISO || !/^\d{4}-\d{2}-\d{2}$/.test(fechaISO)) return { dia: '', dw: null, digitos: null };
      var d = new Date(fechaISO + 'T12:00:00');
      var dw = d.getDay();
      return { dia: DIAS_SEM[dw], dw: dw, digitos: PP_MAPA[dw] || null };
    }
    /* Último dígito de la placa: FAC5418→8, PCN3220→0 */
    function ultimoDigito(placa) {
      var m = /(\d)\D*$/.exec(String(placa || ''));
      return m ? +m[1] : null;
    }
    function vehiculoPermitido(v, pp) {
      if (!pp || !pp.digitos) return true; /* sábado/domingo/sin dato: libre */
      var d = ultimoDigito(v.placa);
      return d != null && pp.digitos.indexOf(d) === -1;
    }
    /* Flota que trabaja el día planificado:
       sábado con FLOTA_SABADO definido → media flota; resto → toda la flota */
    function flotaDelDia(pp) {
      if (pp && pp.dw === 6 && FLOTA_SABADO.length)
        return FLOTA.filter(function(v){ return FLOTA_SABADO.indexOf(v.cod) !== -1; });
      return FLOTA;
    }
    /* ★ Chip P&P reactivo: el input es la FECHA DE DATOS (víspera); el
       despacho y el P&P corresponden a fecha+1. Se actualiza al cambiar
       la fecha, sin necesidad de regenerar. */
    function actualizarChipPP() {
      var fechaDatos = document.getElementById('inpFecha').value || hoyISO();
      var despacho = sumarDiasISO(fechaDatos, 1);
      var pp = picoYPlaca(despacho);
      if (!pp.dia) return; /* fecha inválida: no pintar */
      var rel = despacho === mananaISO() ? 'ma\u00f1ana' : (despacho === hoyISO() ? 'HOY' : '');
      var sabTxt = (pp.dw === 6 && FLOTA_SABADO.length) ? ' \u00b7 media flota (' + FLOTA_SABADO.length + ')' : '';
      var txt = 'Despacho ' + (rel ? rel + ' ' : '') + pp.dia + ' ' + fechaCortaPP(despacho) +
                ' \u00b7 ' + (pp.digitos ? 'P&P ' + pp.digitos.join(',') : 'sin P&P') + sabTxt +
                ' (datos ' + fechaCortaPP(fechaDatos) + ')';
      /* si el plan en pantalla es de otra fecha de datos, avisar que falta regenerar */
      if (planActual && planActual.fecha && planActual.fecha !== fechaDatos) txt += ' \u2192 regenerar';
      var chip = document.getElementById('chipPP');
      chip.textContent = txt;
      chip.className = 'chip ' + (pp.digitos ? 'c-h' : 'c-pt');
    }

    /* ================= [1] HISTORIAL: codigosUsados/{fecha}/{codRuta}/datosFormulario/{idx} ==
       El orden de entrega = momento de captura GPS (regla del negocio).
       ★ v3.5: se incluyen capturas con fecha <= fecha de DATOS, porque las
       capturas del despacho de la víspera se guardan bajo esa misma fecha. */
    function construirHistorial(cuObj, fechas) {
      var hist = [];
      fechas.forEach(function(f) {
        var dia = cuObj[f];
        if (!dia || typeof dia !== 'object') return;
        var transportes = [];
        Object.keys(dia).forEach(function(codT) {
          var nodoT = dia[codT] || {};
          var items = nodoT.datosFormulario || nodoT; /* fallback por compatibilidad */
          var pts = [];
          Object.keys(items).forEach(function(ix) {
            var it = items[ix];
            if (!it || typeof it !== 'object' || !it.gps || !it.gps.fechaCaptura) return; /* sin captura = no visitado */
            var t = Date.parse(it.gps.fechaCaptura);
            if (!isFinite(t)) return;
            var d = new Date(t); /* hora local del navegador (Ecuador) */
            pts.push({
              codc: it.codclnt || null, clnt: it.item || '', sector: it.sector || '',
              lat: it.gps.lat, lng: it.gps.lng, t: t,
              hora: pad2(d.getHours()) + ':' + pad2(d.getMinutes()),
              atenMin: (it.permanencia && isFinite(it.permanencia.minutos)) ? it.permanencia.minutos : null,
              vIni: it.inicio || '', vFin: it.fin || ''
            });
          });
          pts.sort(function(a,b){ return a.t - b.t; }); /* ★ orden = captura GPS */
          if (pts.length) transportes.push({ codigo: codT, puntos: pts });
        });
        if (transportes.length) hist.push({ fecha: f, transportes: transportes });
      });
      return hist;
    }

    /* ================= [2] ESTADISTICAS DEL HISTORIAL ================= */
    function statsHistorial(hist) {
      var cli = {}, pares = {};
      hist.forEach(function(dia) {
        dia.transportes.forEach(function(tr) {
          var pts = tr.puntos;
          pts.forEach(function(p, i) {
            var c = p.codc; if (!c) return;
            var o = cli[c] || (cli[c] = { n:0, orden:[], hora:[], aten:[], vent:{}, nGeo:0, lat:0, lon:0 });
            o.n++; o.orden.push(i + 1);
            if (p.hora) o.hora.push(hhmm2min(p.hora));
            if (p.atenMin != null && p.atenMin >= 0 && p.atenMin <= 120) o.aten.push(p.atenMin);
            if (p.vIni || p.vFin) { var k=(p.vIni||'')+'-'+(p.vFin||''); o.vent[k]=(o.vent[k]||0)+1; }
            if (isFinite(p.lat) && isFinite(p.lng) && !(Math.abs(p.lat)<0.001 && Math.abs(p.lng)<0.001)) { o.lat+=p.lat; o.lon+=p.lng; o.nGeo++; }
            if (i > 0 && pts[i-1].codc) { var kk=pts[i-1].codc+'>'+c; pares[kk]=(pares[kk]||0)+1; }
          });
        });
      });
      Object.keys(cli).forEach(function(c) {
        var o = cli[c];
        o.ordenProm = prom(o.orden);
        o.horaProm = prom(o.hora);
        o.atenProm = o.aten.length ? Math.min(prom(o.aten), PU.atenMaxMin) : null;
        var mk=null, mv=-1; /* ventana moda: la más repetida */
        Object.keys(o.vent).forEach(function(k){ if(o.vent[k]>mv){ mv=o.vent[k]; mk=k; } });
        if (mk) { var ab=mk.split('-'), va=hhmm2min(ab[0]), vb=hhmm2min(ab[1]);
          o.ventModa=(va!=null&&vb!=null)?[va,vb]:null; o.ventTxt=mk; }
        if (o.nGeo) { o.lat/=o.nGeo; o.lon/=o.nGeo; }
      });
      return { cli: cli, pares: pares };
    }

    /* ================= [★] CAMION HABITUAL POR HISTORIAL =================
       El código de transporte de codigosUsados (ej '119') es el COD TRANSPORTE
       de la flota. Vota qué camión ha servido a los clientes de cada ruta. */
    function habitualesDeHistorial(hist) {
      var camiones = {};
      hist.forEach(function(dia) {
        dia.transportes.forEach(function(tr) {
          tr.puntos.forEach(function(p) {
            if (!p.codc) return;
            (camiones[p.codc] = camiones[p.codc] || {});
            camiones[p.codc][tr.codigo] = (camiones[p.codc][tr.codigo] || 0) + 1;
          });
        });
      });
      return camiones;
    }
    function camionHabitualRuta(clientesDeRuta, camiones) {
      var votos = {};
      (clientesDeRuta || []).forEach(function(c) {
        var m = camiones[c.codc]; if (!m) return;
        Object.keys(m).forEach(function(codT) { votos[codT] = (votos[codT] || 0) + m[codT]; });
      });
      var best = null, bv = 0;
      Object.keys(votos).forEach(function(k) { if (votos[k] > bv) { bv = votos[k]; best = k; } });
      return best;
    }

    /* ================= [3] VALIDACION GEO =================
       Precedencia: manual → coordenada del JSON → promedio GPS histórico →
       centroide del sector. Si nada existe: excluido + alerta.             */
    function centroidesSector(clientes, hist) {
      var acc = {};
      function add(sec, la, lo) {
        if (!sec || !isFinite(la) || !isFinite(lo)) return;
        if (Math.abs(la)<0.001 && Math.abs(lo)<0.001) return;
        var a = acc[sec] || (acc[sec]={la:0,lo:0,n:0}); a.la+=la; a.lo+=lo; a.n++;
      }
      clientes.forEach(function(c){ add(c.sector, c.lat, c.lon); });
      hist.forEach(function(d){ d.transportes.forEach(function(tr){
        tr.puntos.forEach(function(p){ add(p.sector, p.lat, p.lng); }); }); });
      var out = {};
      Object.keys(acc).forEach(function(s){ var a=acc[s]; out[s]={lat:a.la/a.n, lon:a.lo/a.n}; });
      return out;
    }
    function prepararClientes(clientes, hist, stats) {
      var alertas = [], cent = centroidesSector(clientes, hist);
      clientes.forEach(function(c) {
        var s = stats.cli[c.codc];
        c._aten = (s && s.atenProm != null) ? s.atenProm : PU.atenMinDef; /* permanencia real medida */
        if (ventana(c.horarios)) { c._vent = ventana(c.horarios); c._vFuente = 'indicada'; }
        else if (s && s.ventModa) { c._vent = s.ventModa; c._vFuente = 'hist\u00f3rica ' + s.ventTxt; }
        else { c._vent = null; c._vFuente = ''; }
        var man = COORDS_MANUALES[c.codc];
        if (man) { c.lat = man.lat; c.lon = man.lon; c.geoFallback = 'coordenada manual'; return; }
        if (isFinite(c.lat) && isFinite(c.lon) && !(Math.abs(c.lat)<0.001 && Math.abs(c.lon)<0.001)) return;
        if (s && s.nGeo > 0) { c.lat = s.lat; c.lon = s.lon; c.geoFallback = 'promedio GPS hist\u00f3rico (' + s.nGeo + ' capturas)'; return; }
        var ce = cent[c.sector];
        if (ce) { c.lat = ce.lat; c.lon = ce.lon; c.geoFallback = 'centroide sector "' + c.sector + '"'; return; }
        alertas.push('Sin coordenada para ' + c.clnt + ' (' + c.codc + ') \u2014 excluido del plan');
        c._excluir = true;
      });
      return { clientes: clientes.filter(function(c){ return !c._excluir; }), alertas: alertas };
    }

    /* ================= [4] EMPAQUE FFD (cap 3 t) =================
       Cada registro = 1 punto de entrega. Si un punto excede 3 t →
       vehículo DEDICADO con N viajes al mismo punto (no se mezcla).        */
    function empacarClientes(cl, cap) {
      var pedidos = [], bins = [];
      cl.forEach(function(c) {
        if (c.peso > cap) {
          c._viajes = Math.ceil(c.peso / cap);
          bins.push({ carga: c.peso, items: [c], dedicado: true, viajes: c._viajes });
        } else pedidos.push(c);
      });
      /* prioridad "alta" primero, luego first-fit-decreasing por peso */
      pedidos.sort(function(a,b){
        var pa=/alta/i.test(a.prioridad||'')?0:1, pb=/alta/i.test(b.prioridad||'')?0:1;
        if (pa!==pb) return pa-pb;
        return b.peso - a.peso;
      });
      pedidos.forEach(function(c) {
        var b = null;
        for (var i = 0; i < bins.length; i++)
          if (!bins[i].dedicado && bins[i].carga + c.peso <= cap) { b = bins[i]; break; }
        if (!b) { b = { carga:0, items:[], dedicado:false, viajes:1 }; bins.push(b); }
        b.items.push(c); b.carga += c.peso;
      });
      return bins;
    }

    /* ================= [5] SECUENCIACION: NN + 2-opt ================= */
    function scoreSeq(seq, pares, salidaMin, dep) {
      var km=0, pen=0, eta=salidaMin, prev=dep;
      for (var i = 0; i < seq.length; i++) {
        var c = seq[i], d = prev ? havKm(prev, c) : 0;
        km += d;
        if (i > 0) {
          var b = pares[seq[i-1].codc+'>'+c.codc] || pares[c.codc+'>'+seq[i-1].codc];
          if (b) pen -= PU.wHist * Math.min(b,5)/5;
        }
        eta += d / PU.vKmH * 60;
        if (c._vent && (eta < c._vent[0] || eta > c._vent[1])) pen += PU.wVentana;
        eta += c._aten;
        prev = c;
      }
      return km + pen;
    }
    function optimizar(seq, pares, salidaMin, dep) {
      if (seq.length < 3) return seq;
      var best = seq.slice(), bs = scoreSeq(best, pares, salidaMin, dep), mejoro = true;
      while (mejoro) {
        mejoro = false;
        for (var i = 0; i < best.length-1; i++) for (var j = i+1; j < best.length; j++) {
          var cand = best.slice(), seg = cand.splice(i, j-i+1).reverse();
          Array.prototype.splice.apply(cand, [i,0].concat(seg));
          var s = scoreSeq(cand, pares, salidaMin, dep);
          if (s < bs - 1e-9) { best = cand; bs = s; mejoro = true; }
        }
      }
      return best;
    }
    function nnInicial(g, dep) {
      var rest = g.slice(), seq = [], cur = dep;
      if (!cur) { /* ruta abierta: empezar por el más aislado */
        var bi = 0, bd = -1;
        rest.forEach(function(c,i){ var d=0; rest.forEach(function(o){ if(o!==c) d+=havKm(c,o); }); if(d>bd){bd=d;bi=i;} });
        cur = rest.splice(bi,1)[0]; seq.push(cur);
      }
      while (rest.length) {
        var b2 = 0, bd2 = Infinity;
        rest.forEach(function(c,i){ var d=havKm(cur,c); if(d<bd2){bd2=d;b2=i;} });
        cur = rest.splice(b2,1)[0]; seq.push(cur);
      }
      return seq;
    }

    /* ================= [6] HORA DE SALIDA: mediana de primeras capturas ================= */
    function salidaEstimada(hist) {
      var prim = [];
      hist.forEach(function(d){ d.transportes.forEach(function(tr){
        if (!tr.puntos.length) return;
        var t0 = Math.min.apply(null, tr.puntos.map(function(p){ return p.t; }));
        var dt = new Date(t0); prim.push(dt.getHours()*60 + dt.getMinutes());
      }); });
      if (!prim.length) return 8*60;
      prim.sort(function(a,b){ return a-b; });
      return prim[Math.floor(prim.length/2)];
    }

    /* ================= API PRINCIPAL ================= */
    function planificarDia(clientesRaw, hist, opts) {
      opts = opts || {};
      var stats = statsHistorial(hist);
      var prep = prepararClientes(clientesRaw, hist, stats);
      var clientes = prep.clientes, alertas = prep.alertas.slice();
      var dep = opts.deposito || null;
      var salidaMin = hhmm2min(opts.salida) || salidaEstimada(hist);
      /* ★ v3.5: la fecha del input es la de DATOS (víspera).
         El despacho real (y el pico y placa) es fecha + 1 día. */
      var fechaDespacho = sumarDiasISO(opts.fecha, 1);
      var pp = picoYPlaca(fechaDespacho);
      var flotaDia = flotaDelDia(pp);
      var habituales = habitualesDeHistorial(hist);

      var porRuta = {};
      clientes.forEach(function(c){ (porRuta[c.ruta || 'SIN RUTA'] = porRuta[c.ruta || 'SIN RUTA'] || []).push(c); });

      var planes = [];
      Object.keys(porRuta).sort().forEach(function(ruta) {
        var bins = empacarClientes(porRuta[ruta], CAP_KG);
        bins.forEach(function(b, bi) {
          var seq = optimizar(nnInicial(b.items, dep), stats.pares, salidaMin, dep);
          var eta = salidaMin, kmTot = 0, det = [], pesoT = 0, fuera = 0;
          seq.forEach(function(c, i) {
            var prev = i > 0 ? seq[i-1] : dep;
            var dKm = prev ? havKm(prev, c) : 0;
            kmTot += dKm; pesoT += c.peso; eta += dKm / PU.vKmH * 60;
            var fueraV = c._vent ? (eta < c._vent[0] || eta > c._vent[1]) : false;
            if (fueraV) fuera++;
            var s = stats.cli[c.codc];
            det.push({
              orden: i+1, codc: c.codc, clnt: c.clnt, sector: c.sector || '',
              peso: c.peso, lat: round6(c.lat), lon: round6(c.lon),
              etaTxt: fmtMin(eta), kmDesdeAnterior: Math.round(dKm*10)/10,
              ventanaTxt: c._vent ? fmtMin(c._vent[0])+'-'+fmtMin(c._vent[1]) : '',
              ventanaFuente: c._vFuente || '', fueraVentana: fueraV,
              viajes: c._viajes || null,
              geoFallback: c.geoFallback || null,
              historial: s ? { visitas:s.n, ordenProm:Math.round(s.ordenProm*10)/10,
                atenPromMin:(s.atenProm!=null?Math.round(s.atenProm):null),
                horaProm:(s.horaProm!=null?fmtMin(s.horaProm):null), ventTxt:s.ventTxt||'' } : null
            });
            eta += c._aten;
          });
          if (fuera > 0) alertas.push(ruta + ': ' + fuera + ' parada(s) fuera de ventana estimada');
          if (b.dedicado) {
            var c0 = b.items[0];
            alertas.push(ruta + ': ' + c0.clnt + ' (' + fmtKg(c0.peso) + ' kg) excede ' + fmtKg(CAP_KG) + ' kg \u2192 vehículo dedicado, ' + b.viajes + ' viajes al mismo punto');
          }
          planes.push({ ruta: ruta, transporte: 'T' + (bi+1), dedicado: !!b.dedicado, viajes: b.viajes || 1,
            pesoTotal: pesoT, capKg: CAP_KG,
            utilizacion: Math.min(100, Math.round(pesoT/(CAP_KG*(b.viajes||1))*100)),
            kmTotal: Math.round(kmTot*10)/10,
            finEstimado: fmtMin(eta), paradas: det.length, secuencia: det });
        });
      });

      /* ================= ★ ASIGNACION DE VEHICULOS REALES =================
         Orden: rutas más pesadas primero. Para cada una, de la flota DEL DÍA
         DE DESPACHO (sábado = media flota) y permitida por P&P y no usada:
         1º camión habitual del historial
         2º el de mayor capacidad disponible (c1 de referencia)
         Sin candidatos → queda genérico T# + alerta */
      var usadosV = {};
      planes.slice().sort(function(a,b){ return b.pesoTotal - a.pesoTotal; }).forEach(function(pl) {
        var disp = flotaDia.filter(function(v){ return vehiculoPermitido(v, pp) && !usadosV[v.cod]; });
        var hab = camionHabitualRuta(porRuta[pl.ruta], habituales);
        var elegido = hab ? disp.filter(function(v){ return v.cod === hab; })[0] : null;
        if (!elegido) { disp.sort(function(a,b){ return (b.c1||0) - (a.c1||0); }); elegido = disp[0] || null; }
        if (elegido) {
          usadosV[elegido.cod] = true;
          pl.transporte = elegido.cod;
          pl.conductor = elegido.nom;
          pl.placa = elegido.placa;
        } else {
          alertas.push('Pico y placa ' + pp.dia + ' ' + fechaCortaPP(fechaDespacho) + (pp.digitos ? ' (' + pp.digitos.join(',') + ')' : '') + ': sin veh\u00edculos disponibles para ' + pl.ruta);
        }
      });

      return { ts: Date.now(), version: 'v3.5-3t-pp', capKg: CAP_KG, salidaEstimada: fmtMin(salidaMin),
        diasHistorial: hist.length, deposito: dep,
        fechaDespacho: fechaDespacho, picoPlaca: pp, alertas: alertas, planes: planes };
    }

    /* ================= FIREBASE: LECTURAS / ESCRITURA ================= */
    function normalizarDeposito(v) {
      if (!v) return null;
      var lat = (v.lat != null) ? v.lat : v['lat:']; /* ★ maneja el typo "lat:" del nodo deposito */
      var lon = v.lon;
      if (!isFinite(lat) || !isFinite(lon) || (Math.abs(lat)<0.001 && Math.abs(lon)<0.001)) return null;
      return { lat: lat, lon: lon };
    }
    /* Buscador recursivo de los items de planificación bajo rutas/{fecha}.
       Un item válido tiene "codc" (planificación) — no lo confunde con
       codclnt (capturas), plan, deposito ni otros nodos. */
    function buscarClientesEnFecha(nodo, prof) {
      if (!nodo || typeof nodo !== 'object' || prof > 3) return null;
      if (Array.isArray(nodo)) {
        if (nodo.length && nodo[0] && nodo[0].codc != null) return nodo;
      } else {
        var vals = objVals(nodo);
        if (vals.length && vals[0] && typeof vals[0] === 'object' && vals[0].codc != null) return vals;
      }
      var excluidos = { codigosUsados:1, plan:1, deposito:1, planificacion:1 };
      var keys = Object.keys(nodo);
      for (var i = 0; i < keys.length; i++) {
        if (excluidos[keys[i]]) continue;
        var v = nodo[keys[i]];
        if (v && typeof v === 'object') {
          var r = buscarClientesEnFecha(v, prof + 1);
          if (r) return r;
        }
      }
      return null;
    }
    /* 3 lecturas paralelas (tras autenticar): deposito + historial (raiz) + clientes de la fecha */
    function generar() {
      var fecha = document.getElementById('inpFecha').value || hoyISO(); /* ★ fecha de DATOS (víspera) */
      if (!FB_OK) { modoDemo(fecha); return; }
      estado('Autenticando...', true);
      esperarAuth().then(function(ok) {
        if (!ok) throw new Error('No se pudo autenticar (verifica Authentication \u2192 An\u00f3nimo habilitado)');
        estado('Cargando Firebase...', true);
        return Promise.all([
          db.ref('rutas/deposito').once('value'),
          db.ref('codigosUsados').orderByKey().limitToLast(PU.diasHist + 1).once('value'),
          db.ref('rutas/' + fecha).once('value')
        ]);
      }).then(function(rs) {
        if (!rs) return;
        var dep = normalizarDeposito(rs[0].val());
        var cuObj = rs[1].val() || {};
        /* ★ v3.5: fechas de captura <= fecha de DATOS — las capturas del
           despacho de la víspera se guardan bajo la misma fecha de carga
           y son el dato más reciente para el historial */
        var fechasHist = Object.keys(cuObj).sort().filter(function(f){ return f <= fecha; });
        var hist = construirHistorial(cuObj, fechasHist);
        var clientes = buscarClientesEnFecha(rs[2].val(), 0);
        if (!clientes || !clientes.length) { estado('La fecha ' + fecha + ' no tiene clientes planificados en rutas/' + fecha, false, true); return; }
        ejecutarPlan(fecha, clientes, hist, dep);
      }).catch(function(e){ estado('Error Firebase: ' + e.message, false, true); });
    }
    function guardarPlan() {
      if (!planActual || !db) return;
      var desp = planActual.fechaDespacho ? ' (despacho ' + planActual.fechaDespacho + ')' : '';
      if (!confirm('\u00bfGuardar plan de ' + planActual.fecha + desp + ' en rutas/' + planActual.fecha + '/plan ?')) return;
      estado('Guardando...', true);
      esperarAuth().then(function() {
        var limpio = JSON.parse(JSON.stringify(planActual)); /* quita propiedades runtime (_color) */
        limpio.planes.forEach(function(p){ delete p._color; });
        return db.ref('rutas/' + planActual.fecha + '/plan').set(limpio);
      }).then(function(){ estado('Plan guardado en rutas/' + planActual.fecha + '/plan \u2713'); })
      .catch(function(e){ estado('Error al guardar: ' + e.message, false, true); });
    }
    function copiarJSON() {

      else { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove(); estado('JSON copiado \u2713'); }

    function ejecutarPlan(fecha, clientes, hist, dep) {
      var plan = planificarDia(clientes, hist, { deposito: dep, fecha: fecha });
      plan.fecha = fecha; /* fecha de DATOS (víspera) */
      planActual = plan;
      renderPlan(plan); renderSidebar(plan);
      document.title = 'Plan ' + fecha + ' \u00b7 Planificador';
      actualizarChipPP(); /* ★ chip coherente: despacho = datos + 1 */
      var totV = plan.planes.length, totC = plan.planes.reduce(function(s,p){ return s+p.paradas; },0);
      var totKg = plan.planes.reduce(function(s,p){ return s+p.pesoTotal; },0);
      var totKm = plan.planes.reduce(function(s,p){ return s+p.kmTotal; },0);
      document.getElementById('btnSave').disabled = !FB_OK;
      document.getElementById('btnCopy').disabled = false;
      estado('Despacho ' + plan.fechaDespacho + ': ' + totV + ' veh\u00edculo(s), ' + totC + ' paradas, ' + fmtKg(totKg) + ' kg, ' + totKm + ' km' + (hist.length ? ' \u00b7 historial ' + hist.length + ' d\u00edas' : ' \u00b7 sin historial'));

    function renderPlan(plan) {
      Object.keys(groups).forEach(function(k){ map.removeLayer(groups[k]); });
      groups = {}; mkIndex = {};
      if (plan.deposito) {
        var gd = L.layerGroup();
        var dm = L.marker([plan.deposito.lat, plan.deposito.lon], {
          icon: L.divIcon({ className:'mk', html:'<div class="mk-dep"><i class="fa-solid fa-warehouse"></i></div>', iconSize:[34,34], iconAnchor:[17,17], popupAnchor:[0,-18] })
        });
        dm.bindPopup('<div class="pp"><div class="pp-num">Dep\u00f3sito</div><div class="pp-nombre">Salida del plan</div><div class="pp-row"><i class="fa-regular fa-clock"></i>Salida estimada ' + plan.salidaEstimada + ' (' + esc(plan.fechaDespacho || '') + ')</div></div>');
        dm.addTo(gd); gd.addTo(map);
      }
      plan.planes.forEach(function(pl, pi) {
        var col = PALETA[pi % PALETA.length]; pl._color = col;
        var g = L.layerGroup(); groups[String(pi)] = g;
        if (!ocultos[String(pi)]) g.addTo(map);
        var rutaPts = plan.deposito ? [[plan.deposito.lat, plan.deposito.lon]] : [];
        pl.secuencia.forEach(function(d, di) {
          rutaPts.push([d.lat, d.lon]);
          var icon = L.divIcon({ className:'mk', html:'<div class="mk-dot" style="background:' + col + '">' + d.orden + (d.viajes ? '*' : '') + '</div>', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-16] });
          var m = L.marker([d.lat, d.lon], { icon: icon });
          m.bindPopup(popupCliente(pl, d, di > 0 ? pl.secuencia[di-1] : plan.deposito, col), { maxWidth: 280 });
          if (d.sector) m.bindTooltip(esc(d.sector), { permanent:true, direction:'right', offset:[13,0], className:'lbl-sector', opacity:1 });
          m.addTo(g);
          mkIndex[pi + ':' + d.orden] = m;
        });
        L.polyline(rutaPts, { color: col, weight: 3.5, opacity: 0.65, lineJoin:'round', lineCap:'round' }).addTo(g);
      });
      fitAll();
    }

    function renderSidebar(plan) {
      document.getElementById('sbTitulo').textContent = 'Plan ' + plan.fecha + ' \u2192 despacho ' + (plan.fechaDespacho || '');
      var totC = plan.planes.reduce(function(s,p){ return s+p.paradas; },0);
      var totKg = plan.planes.reduce(function(s,p){ return s+p.pesoTotal; },0);
      var totKm = plan.planes.reduce(function(s,p){ return s+p.kmTotal; },0);
      var pp = plan.picoPlaca;
      document.getElementById('sbChips').innerHTML =
        '<span class="chip c-tr">' + plan.planes.length + ' veh\u00edculos</span>' +
        '<span class="chip c-pt">' + totC + ' paradas</span>' +
        '<span class="chip c-kg">' + fmtKg(totKg) + ' kg</span>' +
        '<span class="chip c-km">' + totKm + ' km</span>' +
        '<span class="chip c-h">salida ' + plan.salidaEstimada + '</span>' +
        '<span class="chip c-h">hist ' + plan.diasHistorial + ' d</span>';
      var al = document.getElementById('alertas');
      if (plan.alertas.length) {
        al.style.display = 'block';
        al.innerHTML = plan.alertas.map(function(a){ return '<div><i class="fa-solid fa-triangle-exclamation"></i> ' + esc(a) + '</div>'; }).join('');
      } else { al.style.display = 'none'; al.innerHTML = ''; }

      /* ★ flota del día de despacho (sábado = media flota si está definida) */
      var fDia = flotaDelDia(pp);
      var usados = {};
      plan.planes.forEach(function(pl){ if (pl.transporte) usados[pl.transporte] = true; });

      var html = '';
      plan.planes.forEach(function(pl, pi) {
        var vAct = FLOTA.filter(function(x){ return x.cod === pl.transporte; })[0];
        var ppBad = vAct && !vehiculoPermitido(vAct, pp);
        html += '<div class="sb-plan" data-pi="' + pi + '">';
        html += '<div class="sb-bar" style="background:' + pl._color + '"></div>';
        html += '<div class="sb-content">';
        html += '<div class="sb-top"><span class="sb-codigo" style="color:' + pl._color + '">' + esc(pl.transporte) + ' \u00b7 ' + esc(pl.ruta) + (pl.dedicado ? ' \u00b7 dedicado' : '') + (ppBad ? ' <span style="color:#f87171">\ud83d\udeabP&P</span>' : '') + '</span><span class="sb-badge ' + (pl.dedicado ? 'bd' : 'bp') + '">' + pl.utilizacion + '%' + (pl.viajes > 1 ? ' \u00b7 ' + pl.viajes + 'v' : '') + '</span></div>';
        /* ★ selector de camión: etiqueta CAMIÓN + dropdown */
        html += '<div class="sb-veh"><span class="veh-lbl"><i class="fa-solid fa-truck"></i>Camión</span><select class="veh-sel" data-pi="' + pi + '" title="Cambiar transportista de esta ruta">';
        if (!vAct) html += '<option value="__na__" selected>\u2014 ' + esc(pl.transporte) + ' sin asignar \u2014</option>';
        var lista = fDia.slice();
        if (vAct && !lista.some(function(x){ return x.cod === vAct.cod; })) lista.unshift(vAct);
        lista.forEach(function(v) {
          var ok = vehiculoPermitido(v, pp);
          var enDia = fDia.some(function(x){ return x.cod === v.cod; });
          var ya = usados[v.cod] && v.cod !== pl.transporte;
          var tag = (!ok ? '\ud83d\udeab' : '') + (!enDia ? '\u2694' : '') + (ya ? '\u26a0 ' : '');
          html += '<option value="' + esc(v.cod) + '"' + (v.cod === pl.transporte ? ' selected' : '') + '>' + tag + v.cod + ' ' + esc(v.nom) + ' (' + esc(v.placa) + ')</option>';
        });
        html += '</select></div>';
        html += '<div class="sb-meta"><i class="fa-solid fa-weight-hanging"></i>' + fmtKg(pl.pesoTotal) + ' kg &middot; <i class="fa-solid fa-location-dot"></i>' + pl.paradas + ' &middot; <i class="fa-solid fa-road"></i>' + pl.kmTotal + ' km &middot; <i class="fa-regular fa-clock"></i>fin ~' + pl.finEstimado + '</div>';
        html += '<div class="sb-paradas">';
        pl.secuencia.forEach(function(d) {
          html += '<div class="sb-parada" data-key="' + pi + ':' + d.orden + '">';
          html += '<span class="sp-num" style="background:' + pl._color + '">' + d.orden + (d.viajes ? '*' : '') + '</span>';
          html += '<div class="sp-body"><div class="sp-nombre">' + esc(d.clnt) + '</div><div class="sp-meta">ETA ' + d.etaTxt + (d.ventanaTxt ? ' \u00b7 ' + (d.fueraVentana ? '<span style="color:#f87171;font-weight:700">fuera vent</span>' : 'vent ' + d.ventanaTxt) : '') + (d.viajes ? ' \u00b7 ' + d.viajes + ' viajes' : '') + '</div></div></div>';
        });
        html += '</div></div>';
        html += '<button class="sb-eye' + (ocultos[String(pi)] ? ' off' : '') + '" data-pi="' + pi + '" title="Mostrar/ocultar"><i class="fa-solid fa-' + (ocultos[String(pi)] ? 'eye-slash' : 'eye') + '"></i></button></div>';
      });
      document.getElementById('sbList').innerHTML = html;
    }

    /* ================= INTERACCIONES ================= */
    function bindList() {
      var el = document.getElementById('sbList');
      el.addEventListener('click', function(e) {
        var eye = e.target.closest('.sb-eye');
        if (eye) { e.stopPropagation(); togVis(eye.getAttribute('data-pi'), eye); return; }
        var par = e.target.closest('.sb-parada');
        if (par) { e.stopPropagation(); focoParada(par.getAttribute('data-key')); return; }
        var pl = e.target.closest('.sb-plan');
        if (pl && !e.target.closest('.veh-sel')) { pl.classList.toggle('open'); zoomPlan(pl.getAttribute('data-pi')); }
      });
      /* ★ cambio manual de vehículo con intercambio automático */
      el.addEventListener('change', function(e) {
        var sel = e.target.closest('.veh-sel');
        if (sel) { e.stopPropagation(); cambiarVehiculo(+sel.getAttribute('data-pi'), sel.value); }
      });
      el.addEventListener('mouseover', function(e) {
        var pl = e.target.closest('.sb-plan');
        if (pl && !pl.contains(e.relatedTarget)) hlPlan(pl.getAttribute('data-pi'));
      });
      el.addEventListener('mouseout', function(e) {
        var pl = e.target.closest('.sb-plan');
        if (pl && !pl.contains(e.relatedTarget)) uhlPlan(pl.getAttribute('data-pi'));
      });
    }
    /* ★ Reasignación manual con swap: si el vehículo ya tenía otra ruta,
       los dos planes intercambian el vehículo. Avisa si viola P&P o
       no pertenece a la flota del día de despacho. */
    function cambiarVehiculo(pi, codNuevo) {
      if (!planActual || codNuevo === '__na__') return;
      var v = FLOTA.filter(function(x){ return x.cod === codNuevo; })[0];
      if (!v) return;
      var pp = planActual.picoPlaca;
      var actual = planActual.planes[pi];
      var prevT = actual.transporte;
      var prevReal = FLOTA.some(function(x){ return x.cod === prevT; });
      var otro = null, otroIdx = -1;
      planActual.planes.forEach(function(p, i) { if (i !== pi && p.transporte === codNuevo) { otro = p; otroIdx = i; } });
      if (otro) {
        if (prevReal) { otro.transporte = prevT; otro.conductor = actual.conductor; otro.placa = actual.placa; }
        else { otro.transporte = 'T' + (otroIdx + 1); otro.conductor = null; otro.placa = null; }
      }
      actual.transporte = v.cod; actual.conductor = v.nom; actual.placa = v.placa;
      var avisos = [];
      if (!vehiculoPermitido(v, pp)) avisos.push('ATENCI\u00d3N: restringido por P&P ' + (pp.digitos || []).join(','));
      var enDia = flotaDelDia(pp).some(function(x){ return x.cod === v.cod; });
      if (!enDia) avisos.push('no pertenece a la flota del d\u00eda');
      estado('Veh\u00edculo ' + v.cod + ' \u2192 ' + actual.ruta + (avisos.length ? ' (' + avisos.join(' \u00b7 ') + ')' : '') + (otro ? ' \u00b7 intercambi\u00f3 con ' + otro.ruta : ''), false, avisos.length > 0);
      renderSidebar(planActual);
    }
    function focoParada(key) {
      var m = mkIndex[key];
      if (!m) return;
      map.setView(m.getLatLng(), Math.max(map.getZoom(), 15));
      m.openPopup();
    }
    function zoomPlan(pi) {
      var g = groups[pi]; if (!g || !planActual) return;
      var b = [];
      if (planActual.deposito) b.push([planActual.deposito.lat, planActual.deposito.lon]);
      g.eachLayer(function(l){ if (l.getLatLng) b.push(l.getLatLng()); });
      if (b.length) map.fitBounds(L.latLngBounds(b), { padding:[50,50], maxZoom:16 });
    }
    function hlPlan(pi) {
      var g = groups[pi]; if (!g) return;
      g.eachLayer(function(l) {
        if (l instanceof L.Polyline) l.setStyle({ weight:7, opacity:1 });
        if (l instanceof L.Marker) { var el = l.getElement(); if (el) { var d = el.querySelector('.mk-dot'); if (d) d.classList.add('hl'); } }
      });
    }
    function uhlPlan(pi) {
      var g = groups[pi]; if (!g) return;
      g.eachLayer(function(l) {
        if (l instanceof L.Polyline) l.setStyle({ weight:3.5, opacity:0.65 });
        if (l instanceof L.Marker) { var el = l.getElement(); if (el) { var d = el.querySelector('.mk-dot'); if (d) d.classList.remove('hl'); } }
      });
    }
    function togVis(pi, btn) {
      var g = groups[pi]; if (!g) return;
      if (map.hasLayer(g)) { map.removeLayer(g); ocultos[pi] = true; btn.classList.add('off'); btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>'; }
      else { g.addTo(map); delete ocultos[pi]; btn.classList.remove('off'); btn.innerHTML = '<i class="fa-solid fa-eye"></i>'; }
    }
    function fitAll() {
      var b = [];
      Object.keys(groups).forEach(function(k) {
        if (!map.hasLayer(groups[k])) return;
        groups[k].eachLayer(function(l){ if (l.getLatLng) b.push(l.getLatLng()); });
      });
      if (b.length) map.fitBounds(L.latLngBounds(b), { padding:[40,40], maxZoom:16 });
    }
    function toggleEtiquetas() {
      etiquetasOn = !etiquetasOn;
      document.body.classList.toggle('sin-etiquetas', !etiquetasOn);
      document.getElementById('btnEtiquetas').classList.toggle('on', etiquetasOn);
      try { localStorage.setItem('plan_etiquetas', etiquetasOn ? '1' : '0'); } catch (e) {}
    }

    /* ================= INIT ================= */
    document.addEventListener('DOMContentLoaded', function() {
      initMapa();
      /* ★ v3.5: el input es la FECHA DE DATOS (víspera). Por defecto HOY:
         los datos cargados hoy en rutas/hoy se despachan MAÑANA. */
      document.getElementById('inpFecha').value = hoyISO();
      /* ★ fecha sugerida desde el mapamonitor (botón "Planificar entregas") */
      try {
        var fSug = localStorage.getItem('plan_fecha_sugerida');
        if (fSug && /^\d{4}-\d{2}-\d{2}$/.test(fSug)) {
          document.getElementById('inpFecha').value = fSug;
          localStorage.removeItem('plan_fecha_sugerida');
        }
      } catch (e) {}
      /* ★ P&P reactivo: al cambiar la fecha de datos, el chip recalcula
         el despacho (fecha+1) y su pico y placa al instante */
      document.getElementById('inpFecha').addEventListener('change', actualizarChipPP);
      actualizarChipPP();
      if (FB_OK) generar();
      else modoDemo(hoyISO());
    });
  </script>
</body>
</html>
