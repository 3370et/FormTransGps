<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de monitoreo</title>
  <!-- SRI oficial de Leaflet 1.9.4 (leafletjs.com) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- ★ P-15: Firebase (App + Database + Auth para sesión anónima) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#08090d;color:#e4e8f1;height:100vh;overflow:hidden;display:flex}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0e1018}
    ::-webkit-scrollbar-thumb{background:#22273a;border-radius:2px}
    #sidebar{width:310px;min-width:310px;background:#0e1018;border-right:1px solid #22273a;display:flex;flex-direction:column;height:100vh;z-index:1000;transition:transform .3s ease}
    #sidebar.hidden{transform:translateX(-100%);min-width:0;width:0;overflow:hidden}
    .sb-head{padding:18px 16px 14px;border-bottom:1px solid #22273a;flex-shrink:0}
    .sb-head h2{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;word-break:break-all}
    .sb-head h2 i{color:#e8913a;font-size:13px;flex-shrink:0}
    .sb-stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
    .sb-stat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
    .sb-stat.s-tr{background:rgba(232,145,58,.1);color:#e8913a;border:1px solid rgba(232,145,58,.2)}
    .sb-stat.s-gp{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
    .sb-stat.s-pr{background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.2)}
    .sb-stat.s-pn{background:rgba(167,139,250,.1);color:#a78bfa;border:1px solid rgba(167,139,250,.2)}
    .sb-stat.s-gap{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.25)}
    .sb-stat.s-so{background:rgba(255,209,102,.1);color:#ffd166;border:1px solid rgba(255,209,102,.25)}
    /* ★ P-15: chips del plan */
    .sb-stat.s-plan{background:rgba(94,234,212,.08);color:#5eead4;border:1px solid rgba(94,234,212,.25)}
    .sb-stat.s-planb{background:rgba(148,163,184,.08);color:#94a3b8;border:1px solid rgba(148,163,184,.25)}
    .frescura{display:none;margin-top:8px;font-size:10.5px;font-weight:700;color:#fbbf24;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);border-radius:8px;padding:6px 10px;align-items:center;gap:6px}
    .sb-btns{display:flex;gap:6px;margin-top:10px}
    .sb-btn-fit{flex:1;padding:8px;border-radius:8px;border:1px solid #22273a;background:#14171f;color:#8891a8;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
    .sb-btn-fit:hover{border-color:#e8913a;color:#e8913a}
    .sb-btn-fit.on{border-color:rgba(232,145,58,.4);color:#e8913a;background:rgba(232,145,58,.08)}
    /* ★ P-15: botón plan + enlace al planificador */
    .sb-btn-planif{border-color:rgba(232,145,58,.35);color:#e8913a;background:rgba(232,145,58,.05)}
    .sb-btn-planif:hover{background:rgba(232,145,58,.14);border-color:#e8913a}
    .sb-list{flex:1;overflow-y:auto;padding:8px}
    .sb-item{display:flex;align-items:stretch;border-radius:10px;margin-bottom:6px;overflow:hidden;border:1px solid #22273a;cursor:pointer;transition:all .2s;background:#14171f}
    .sb-item:hover{border-color:#333a52;background:#191d28}
    .sb-item.active{border-color:#e8913a;background:rgba(232,145,58,.04)}
    .sb-bar{width:5px;flex-shrink:0}
    .sb-content{flex:1;padding:10px 12px;min-width:0}
    .sb-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
    .sb-codigo{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sb-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0;white-space:nowrap}
    .sb-badge.bp{background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.2)}
    .sb-badge.bc{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
    .sb-meta{font-size:11px;color:#565e74}
    .sb-meta i{font-size:10px;margin-right:3px}
    .sb-eye{width:30px;display:flex;align-items:center;justify-content:center;color:#565e74;font-size:11px;cursor:pointer;transition:color .2s;flex-shrink:0;border:none;background:none}
    .sb-eye:hover{color:#e4e8f1}
    .sb-eye.off{color:#2a2f40}
    #map{flex:1;height:100vh;z-index:1}
    .leaflet-container{background:#08090d !important}
    #sbToggle{display:none;position:fixed;top:12px;left:12px;z-index:1100;width:38px;height:38px;border-radius:10px;border:1px solid #22273a;background:rgba(14,16,24,.92);backdrop-filter:blur(8px);color:#8891a8;font-size:15px;cursor:pointer;align-items:center;justify-content:center;transition:all .2s}
    #sbToggle:hover{border-color:#e8913a;color:#e8913a}
    .mk{background:none !important;border:none !important}
    .mk-dot{width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .2s,box-shadow .2s;cursor:pointer}
    .mk-dot:hover{transform:scale(1.25);box-shadow:0 4px 14px rgba(0,0,0,.6)}
    .mk-dot.hl{transform:scale(1.3);box-shadow:0 0 0 4px rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.5)}
    /* P-11 + P-14: marcador "primera captura sin origen" (anclaje intacto) */
    .mk-sin-origen .mk-dot{position:relative;border-color:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.35),0 0 16px 5px rgba(255,209,102,.45)}
    .mk-sin-origen .mk-dot::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #ffd166;animation:sinOrigenPing 1.5s ease-out infinite;pointer-events:none}
    .mk-sin-origen .mk-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2.5px dashed #ffd166;animation:sinOrigenGiro 9s linear infinite;pointer-events:none}
    @keyframes sinOrigenPing{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(2.1);opacity:0}}
    @keyframes sinOrigenGiro{to{transform:rotate(360deg)}}
    /* ★ #2: pulso blanco en el punto actual de rutas en proceso */
    .mk-actual .mk-dot{position:relative}
    .mk-actual .mk-dot::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid #fff;opacity:.8;animation:pulseActual 1.6s ease-out infinite;pointer-events:none}
    @keyframes pulseActual{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.4);opacity:0}}
    /* ★ P-15: fuera de secuencia vs plan (borde rojo punteado) */
    .mk-fuera .mk-dot{border-style:dashed;border-color:#f87171}
    @media (prefers-reduced-motion:reduce){.mk-sin-origen .mk-dot::before,.mk-sin-origen .mk-dot::after,.mk-actual .mk-dot::before{animation:none}}
    .mk-gap{width:26px;height:26px;border-radius:50%;background:#f87171;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.5);border:2px solid #fff;cursor:pointer;transition:transform .2s}
    .mk-gap:hover{transform:scale(1.25)}
    /* ★ P-15: marcador fantasma de parada planificada no ejecutada */
    .mk-plan-dot{width:26px;height:26px;border-radius:50%;border:2px dashed #8891a8;background:rgba(14,16,24,.85);color:#8891a8;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s}
    .mk-plan-dot:hover{transform:scale(1.25);color:#e4e8f1;border-color:#e4e8f1}
    /* ★ Leyenda de sector: etiqueta permanente discreta junto al punto */
    .lbl-sector{background:rgba(14,16,24,.82) !important;border:1px solid #22273a !important;color:#8891a8 !important;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:600;padding:1px 6px !important;border-radius:5px !important;box-shadow:none !important}
    .lbl-sector::before{display:none !important} /* sin flecha del tooltip */
    .sin-etiquetas .lbl-sector{display:none}
    .zoom-lejos .lbl-sector{display:none} /* auto-ocultar al alejar mucho */
    .leaflet-popup-content-wrapper{background:#14171f !important;color:#e4e8f1 !important;border:1px solid #22273a !important;border-radius:12px !important;box-shadow:0 8px 28px rgba(0,0,0,.5) !important;padding:0 !important}
    .leaflet-popup-tip{background:#14171f !important;border:1px solid #22273a !important;border-top:none !important;border-left:none !important}
    .leaflet-popup-close-button{color:#565e74 !important;font-size:18px !important;top:6px !important;right:8px !important}
    .leaflet-popup-close-button:hover{color:#e4e8f1 !important}
    .pp{padding:12px 14px;min-width:180px}
    .pp-num{font-size:9px;color:#565e74;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
    .pp-nombre{font-size:14px;font-weight:700;margin-bottom:6px;line-height:1.3}
    .pp-row{display:flex;align-items:center;gap:5px;font-size:11px;color:#8891a8;margin-bottom:2px;flex-wrap:wrap}
    .pp-row i{width:13px;text-align:center;font-size:9px;color:#565e74;flex-shrink:0}
    .pp-row a{color:#60a5fa;text-decoration:none;font-weight:600}
    .pp-row a:hover{text-decoration:underline}
    /* ===== ★ M3: coordenadas copiables por separado (lat / lng / ambas) ===== */
    .pp-coord{font-family:'Space Grotesk',monospace;font-size:10px;color:#565e74;margin-top:5px;padding-top:5px;border-top:1px solid #22273a;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    .pp-coord .pc-item{display:inline-flex;align-items:center;gap:4px;cursor:pointer;transition:color .15s;padding:1px 2px;border-radius:4px}
    .pp-coord .pc-item:hover{color:#60a5fa}
    .pp-coord .pc-item i{font-size:9px;opacity:.7}
    .pp-coord .pc-item.copiado{color:#34d399 !important;animation:copiadoFade 1.4s ease}
    .pp-coord .pc-sep{color:#3a4054;user-select:none}
    .pp-coord .pc-ambos{display:inline-flex;align-items:center;gap:4px;margin-left:4px;cursor:pointer;color:#565e74;background:#191d28;border:1px solid #22273a;border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;transition:all .15s}
    .pp-coord .pc-ambos:hover{color:#e8913a;border-color:#e8913a}
    .pp-coord .pc-ambos.copiado{color:#34d399 !important;border-color:rgba(52,211,153,.4);animation:copiadoFade 1.4s ease}
    @keyframes copiadoFade{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
    /* ===== ★ M2: entregas coincidentes (mismo codigo u otro transporte) ===== */
    .mk-dot{position:relative}
    .mk-n{position:absolute;top:-9px;right:-11px;background:#ffd166;color:#0f1117;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;border:1.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55);line-height:1.5;pointer-events:none}
    .pp-lista{display:flex;flex-direction:column;gap:5px;margin:4px 0 2px;padding:0;list-style:none}
    .pp-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#191d28;border:1px solid #22273a;border-radius:9px;padding:7px 9px;color:#e4e8f1;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
    .pp-item:hover{border-color:#e8913a;background:rgba(232,145,58,.08)}
    .pp-item .pi-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:800;color:#fff}
    .pp-item .pi-txt{flex:1;min-width:0;display:flex;flex-direction:column}
    .pp-item .pi-nombre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pp-item .pi-sub{font-size:10px;font-weight:500;color:#565e74;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
    .pi-codc{font-family:'Space Grotesk',monospace;font-size:9px;background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.2);border-radius:4px;padding:0 4px}
    .pp-back{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:8px;padding:7px 0 2px;border:none;background:none;color:#8891a8;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:color .15s}
    .pp-back:hover{color:#e8913a}
    .sin-mapa{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#08090d;z-index:5000;text-align:center}
    .sin-mapa i{font-size:42px;color:#22273a;display:block;margin-bottom:14px}
    .sin-mapa p{color:#8891a8;font-size:14px;font-weight:600}
    .sin-mapa small{color:#565e74;font-size:12px;display:block;margin-top:6px}
    @media(max-width:768px){
      #sidebar{position:fixed;left:0;top:0;height:100vh;box-shadow:8px 0 32px rgba(0,0,0,.5)}
      #sidebar.hidden{transform:translateX(-100%)}
      #sbToggle{display:flex}
    }
  </style>
</head>
<body>
  <button id="sbToggle" onclick="document.getElementById('sidebar').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></button>

  <aside id="sidebar">
    <div class="sb-head">
      <h2><i class="fa-solid fa-map-location-dot"></i> <span id="sbTitulo">Mapa</span></h2>
      <div class="sb-stats" id="sbStats"></div>
      <div id="frescura" class="frescura"></div>
      <div class="sb-btns">
        <button class="sb-btn-fit" onclick="fitAll()"><i class="fa-solid fa-expand"></i> Ajustar vista</button>
        <button class="sb-btn-fit on" id="btnEtiquetas" onclick="toggleEtiquetas()" title="Mostrar/ocultar leyenda de sector junto a cada punto"><i class="fa-solid fa-tags"></i> Sectores</button>
        <button class="sb-btn-fit on" id="btnPlan" onclick="togglePlan()" style="display:none" title="Mostrar/ocultar paradas planificadas aún sin captura"><i class="fa-solid fa-clipboard-list"></i> Plan</button>
      </div>
      <!-- ★ P-15: enlace al planificador (pestaña nueva para no romper el puente postMessage) -->
      <div class="sb-btns">
        <a class="sb-btn-fit sb-btn-planif" href="#" onclick="abrirPlanificador(); return false;" title="Abrir el planificador de entregas">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Planificar entregas
        </a>
      </div>
    </div>
    <div class="sb-list" id="sbList"></div>
  </aside>

  <div id="map"></div>

  <div id="sinDatos" class="sin-mapa">
    <div>
      <i class="fa-solid fa-map-location-dot"></i>
      <p>Sin datos de mapa.</p>
      <small>Abre este mapa desde el Panel de monitoreo.</small>
    </div>
  </div>

  <script>
    /* ============================================================
       MAPAMONITOR — consumidor del puente con monitor.html
       ★ P-15 PLAN vs EJECUCION (Firebase)
       ★ M2 — entregas coincidentes (~10 m, mismo codigo u otro
            transporte): UN marcador con insignia xN y popup lista.
       ★ M3 — coordenadas copiables por separado: lat, lng o ambas.
       ★ M4 — delegacion global de popups: el clic en una entrega
            de la lista NUNCA cierra el popup y "volver a la lista"
            es instantaneo (setContent directo, sin re-wiring).
       ★ M5 — popup de puntos xN sobrevive los re-renders del push:
            captura/restauracion del HTML visible, busqueda por
            clave de coincidencia, autoPan rapido, sin parpadeos.
       ★ M6 — la insignia xN NACE con el marcador: los grupos de
            coincidentes se pre-calculan ANTES de renderizar, asi
            el divIcon del representante ya incluye el xN en su
            HTML (antes se pintaba via getElement(), que devuelve
            null en el primer render porque Leaflet monta los
            elementos de forma diferida; la insignia solo aparecia
            tras interactuar o en el siguiente push).
       ============================================================ */

    /* ================= ★ P-15: FIREBASE ================= */
    var FIREBASE_CONFIG = {
      apiKey: "AIzaSyCrnroA2yd2coEVyn6Jm-q8sM6rvOb6Y3k", authDomain: "datos-formulario-f3cde.firebaseapp.com", databaseURL: "https://datos-formulario-f3cde-default-rtdb.firebaseio.com",
      projectId: "datos-formulario-f3cde", storageBucket: "datos-formulario-f3cde.firebasestorage.app", messagingSenderId: "1060204671476", appId: "1:1060204671476:web:a476539fa122fd04fa89a1"
    };
    var FB_OK = !!(FIREBASE_CONFIG.databaseURL);
    var fb = null;
    if (FB_OK) {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        firebase.auth().signInAnonymously().catch(function(e) { console.error('Auth:', e.message); });
        fb = firebase.database();
      } catch (e) { FB_OK = false; }
    }
    function esperarAuth() {
      return new Promise(function(resolve) {
        if (!FB_OK) return resolve(false);
        if (firebase.auth().currentUser) return resolve(true);
        var off = firebase.auth().onAuthStateChanged(function(u) { if (u) { off(); resolve(true); } });
      });
    }

    var U = { desvOk: 100, desvAl: 300, inactOk: 30, inactAl: 60, saltoMin: 60 };
    var T = [];
    var map = null;
    var groups = {};
    var allBounds = [];
    var yaFit = false;
    var ocultos = {};
    var codigoActivo = null;
    var ultimoPayload = null;
    var etiquetasOn = true;

    /* ★ P-15: estado del plan */
    var planIdx = null;
    var cruceActual = null;
    var mostrarPlan = true;

    try { ocultos = JSON.parse(localStorage.getItem('mapa_ocultos') || '{}'); } catch (e) { ocultos = {}; }
    try { etiquetasOn = localStorage.getItem('mapa_etiquetas') !== '0'; } catch (e) {}
    try { mostrarPlan = localStorage.getItem('mapa_plan') !== '0'; } catch (e) {}

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function hkey(h) {
      if (!h) return Infinity;
      if (/^\d{1,2}:\d{2}/.test(h)) { var x = h.split(':'); return (+x[0]) * 60 + (+x[1]); }
      var d = new Date(h);
      return isNaN(d.getTime()) ? Infinity : d.getTime();
    }
    function cuando(h) {
      if (!h) return '';
      if (/^\d{1,2}:\d{2}/.test(h)) return h;
      var d = new Date(h);
      if (isNaN(d.getTime())) return h;
      return d.toLocaleDateString('es-EC', { day: '2-digit', month: 'short' }) + ' \u00b7 ' + d.toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' });
    }
    function fmtDur(m) {
      if (m < 60) return m + ' min';
      return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }

    /* ================= ★ P-15: utilidades del plan ================= */
    function pad2(n){ return (n < 10 ? '0' : '') + n; }
    function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function hhmm2min(s){ var m = /^(\d{1,2}):(\d{2})/.exec(String(s || '').trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; }
    function normNombre(s){ return String(s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]+/g, ' ').trim(); }
    function havM(la1, lo1, la2, lo2) {
      var dLa = (la2 - la1) * Math.PI / 180, dLo = (lo2 - lo1) * Math.PI / 180;
      var s = Math.pow(Math.sin(dLa / 2), 2) + Math.cos(la1 * Math.PI / 180) * Math.cos(la2 * Math.PI / 180) * Math.pow(Math.sin(dLo / 2), 2);
      return 2 * 6371000 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
    }
    function fechaCorta(iso){ if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || ''; return iso.slice(8, 10) + '/' + iso.slice(5, 7); }

    /* ============================================================
       ★ M2/M3/M4/M5/M6 — utilidades de coincidentes + portapapeles
       ============================================================ */
    var UMB_COINC_M = 10; /* metros: umbral de "misma ubicacion" */
    var COINC_DE = {};    /* clave "lat|lng" redondeada -> grupo del render actual */
    var COINC_LIST = [];  /* lista plana con idx para los data-reg del popup */

    function copiarAlPortapapeles(txt, el) {
      function ok() {
        if (el) { el.classList.add('copiado'); setTimeout(function() { el.classList.remove('copiado'); }, 1400); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok).catch(function() { fbCopy(txt, ok); });
      } else { fbCopy(txt, ok); }
    }
    function fbCopy(txt, cb) {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.cssText = 'position:fixed;left:-9999px;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); cb(); } catch (e) {}
      document.body.removeChild(ta);
    }
    /* ★ M3: coordenadas — cada valor copiable por separado + "ambas" */
    function coordClickableHTML(lat, lng) {
      var la = Number(lat).toFixed(6), ln = Number(lng).toFixed(6);
      return '<span class="pp-coord">'
        + '<span class="pc-item" data-cmd="coord" data-val="' + esc(la) + '" title="Clic para copiar latitud"><i class="fa-regular fa-copy"></i>' + la + '</span>'
        + '<span class="pc-sep">,</span>'
        + '<span class="pc-item" data-cmd="coord" data-val="' + esc(ln) + '" title="Clic para copiar longitud"><i class="fa-regular fa-copy"></i>' + ln + '</span>'
        + '<span class="pc-ambos" data-cmd="coord" data-val="' + esc(la + ', ' + ln) + '" title="Clic para copiar ambas"><i class="fa-solid fa-clone"></i> ambas</span>'
        + '</span>';
    }
    function claveCoinc(lat, lng) {
      return lat.toFixed(4) + '|' + lng.toFixed(4);
    }
    function tActualDe(tq) {
      var mx = 0;
      (tq.puntos || []).forEach(function(q) { if (!q.pendiente && q.t != null && q.t > mx) mx = q.t; });
      return mx || null;
    }

    /* ============================================================
       ★ PATCH M4 — DELEGACION GLOBAL DE POPUPS
       Todo el contenido interactivo del popup usa comandos data-cmd,
       atendidos por UN solo listener en fase captura con
       stopPropagation inmediato: el clic nunca llega al mapa, el
       popup NUNCA se cierra al seleccionar una entrega, y "volver a
       la lista" es un setContent directo (instantaneo, sin rewiring).
       ============================================================ */
    document.addEventListener('click', function(e) {
      var c = e.target && e.target.closest ? e.target.closest('[data-cmd]') : null;
      if (!c) return;
      e.stopPropagation();   /* clave: el mapa nunca ve este clic */
      e.preventDefault();

      var cmd = c.getAttribute('data-cmd');

      /* --- M3: copiar coordenadas (lat, lng o ambas) --- */
      if (cmd === 'coord') {
        copiarAlPortapapeles(c.getAttribute('data-val'), c);
        return;
      }

      if (cmd !== 'item' && cmd !== 'back') return;

      /* --- M4: encontrar el grupo de coincidentes del popup --- */
      var reg = popupRegDe(c);
      if (!reg || !reg.marker) return;
      var p = reg.marker.getPopup();
      if (!p) return;

      /* --- volver a la lista: instantaneo --- */
      if (cmd === 'back') {
        p.setContent(htmlListaCoincidencias(reg));
        return;
      }

      /* --- elegir una entrega: detalles sin cerrar el popup --- */
      var it = reg.items[+c.getAttribute('data-ix')];
      if (!it) return;
      p.setContent(construirDetallesG(it.t, it.p, (it.p.pendiente ? '?' : it.num), it.gapsArr, reg.idx, true));
    }, true);

    /* ★ M4: dado un elemento dentro de un popup, encuentra su grupo
       COINC_DE (via data-reg embebido; fallback por marcador abierto) */
    function popupRegDe(el) {
      var pp = (el.closest && el.closest('[data-reg]')) || (el.querySelector && el.querySelector('[data-reg]'));
      if (pp) {
        var ix = pp.getAttribute('data-reg');
        if (ix != null && ix !== '' && COINC_LIST[+ix]) return COINC_LIST[+ix];
      }
      var popNode = (el.closest && el.closest('.leaflet-popup-content')) || null;
      var found = null;
      if (popNode) {
        Object.keys(COINC_DE).forEach(function(k) {
          if (found || !COINC_DE[k].marker) return;
          var pe = COINC_DE[k].marker.getPopup();
          var pel = pe ? pe.getElement() : null;
          if (pel && pel.contains(popNode)) found = COINC_DE[k];
        });
      }
      return found;
    }
    /* ★ M4 + M5: reconstruye la lista plana con indices. NO toca el
       contenido de popups abiertos (evita parpadeo/pérdida de vista):
       la restauración final se encarga de dejarlos consistentes.
       Aquí también queda la lista final correcta de los multipunto
       cerrados (los nacidos en M6 con lista parcial de 1 item se
       completan aquí, siempre antes de que el usuario los abra). */
    function reconstruirCoincList() {
      COINC_LIST = [];
      Object.keys(COINC_DE).forEach(function(k) {
        var reg = COINC_DE[k];
        reg.idx = COINC_LIST.length;
        COINC_LIST.push(reg);
        if (reg.marker && reg.multipunto
            && !(reg.marker.isPopupOpen && reg.marker.isPopupOpen())) {
          reg.marker.setPopupContent(htmlListaCoincidencias(reg));
        }
      });
    }

    /* ★ P-15 (M4): filas del plan para UN punto */
    function filasPlanQ(q) {
      var esPenQ = !!q.pendiente;
      var fx = '';
      if (q._plan) {
        var en = q._plan;
        fx += '<div class="pp-row"><i class="fa-solid fa-clipboard-list" style="color:#5eead4"></i><span style="color:#5eead4;font-weight:700">Plan ' + esc(en.ruta) + ' #' + en.orden + '</span>' + (en.transporte ? ' &middot; ' + esc(en.transporte) : '') + ' &middot; ETA ' + esc(en.etaTxt) + '</div>';
        if (en.ventanaTxt) fx += '<div class="pp-row"><i class="fa-solid fa-hourglass-half"></i>Ventana plan ' + esc(en.ventanaTxt) + (en.ventanaFuente ? ' <span style="color:#565e74">(' + esc(en.ventanaFuente) + ')</span>' : '') + '</div>';
        if (!esPenQ && q._planReal != null) {
          if (q._planReal === en.orden) {
            fx += '<div class="pp-row"><i class="fa-solid fa-circle-check" style="color:#34d399"></i><span style="color:#34d399;font-weight:700">En secuencia seg\u00fan plan</span></div>';
          } else {
            fx += '<div class="pp-row"><i class="fa-solid fa-shuffle" style="color:#f87171"></i><span style="color:#f87171;font-weight:700">Fuera de secuencia: plan #' + en.orden + ' &rarr; real #' + q._planReal + '</span></div>';
          }
          var etaM = hhmm2min(en.etaTxt), realM = hhmm2min(q.hora);
          if (etaM != null && realM != null) {
            var df = realM - etaM;
            if (Math.abs(df) >= 5) {
              var colDf = df > 0 ? '#fbbf24' : '#34d399';
              fx += '<div class="pp-row"><i class="fa-regular fa-clock" style="color:' + colDf + '"></i><span style="color:' + colDf + ';font-weight:700">Llegada ' + Math.abs(df) + ' min ' + (df > 0 ? 'despu\u00e9s' : 'antes') + ' del plan</span></div>';
            }
          }
        }
      }
      return fx;
    }
    /* ★ M2: detalles completos de UNA entrega. regIdx/conBack se usan
       desde la lista de coincidentes (delegacion M4) */
    function construirDetallesG(tq, q, numQ, gapsArr, regIdx, conBack) {
      var esPenQ = !!q.pendiente;
      var col = tq.color;
      var ph = '<div class="pp"' + (regIdx != null ? ' data-reg="' + regIdx + '"' : '') + '>';
      ph += '<div class="pp-num">' + (esPenQ ? 'Pendiente de captura' : 'Punto ' + numQ) + ' &middot; ' + esc(tq.codigo) + '</div>';
      ph += '<div class="pp-nombre" style="color:' + col + '">' + esc(q.nombre) + '</div>';
      if (q.codc) ph += '<div class="pp-row"><i class="fa-solid fa-barcode"></i><span class="pi-codc">' + esc(q.codc) + '</span></div>';
      if (q.sector) ph += '<div class="pp-row"><i class="fa-solid fa-tag"></i>' + esc(q.sector) + '</div>';
      if (esPenQ) {
        ph += filasPlanQ(q);
        ph += '<div class="pp-row"><i class="fa-solid fa-hourglass-half"></i>GPS aun no capturado</div>';
        ph += '<div class="pp-row"><a href="https://www.google.com/maps?q=' + q.lat + ',' + q.lng + '" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i> Ir a capturar</a></div>';
      } else {
        var esActualQ = (!q.sinOrigen && tq.estado === 'en_proceso' && tActualDe(tq) === q.t);
        if (esActualQ) ph += '<div class="pp-row"><i class="fa-solid fa-location-crosshairs" style="color:#60a5fa"></i><span style="color:#60a5fa;font-weight:700">Ultima posicion conocida</span></div>';
        ph += '<div class="pp-row"><i class="fa-regular fa-clock"></i>' + esc(cuando(q.hora)) + '</div>';
        ph += filasPlanQ(q);
        if (q._gIdx > 0 && gapsArr && gapsArr[q._gIdx] != null && gapsArr[q._gIdx] > U.saltoMin * 60000) {
          ph += '<div class="pp-row"><i class="fa-solid fa-triangle-exclamation" style="color:#f87171"></i><span style="color:#f87171;font-weight:700">Salto de ' + fmtDur(Math.round(gapsArr[q._gIdx] / 60000)) + ' desde el punto anterior</span></div>';
        }
        if (q.precision) ph += '<div class="pp-row"><i class="fa-solid fa-crosshairs"></i>Precision: ' + esc(q.precision) + '</div>';
        if (q.sinOrigen) ph += '<div class="pp-row"><i class="fa-solid fa-circle-notch" style="color:#ffd166"></i><span style="color:#ffd166;font-weight:700">Primera captura: sin coordenada de origen</span></div>';
        if (q.dist !== '' && q.dist != null && isFinite(q.dist)) {
          var sv = q.dist < U.desvOk ? '#34d399' : (q.dist < U.desvAl ? '#fbbf24' : '#f87171');
          var svT = q.dist < U.desvOk ? 'Alineado' : (q.dist < U.desvAl ? 'Desviacion moderada' : 'DESVIACION ALTA');
          ph += '<div class="pp-row"><i class="fa-solid fa-arrows-left-right" style="color:' + sv + '"></i><span style="color:' + sv + ';font-weight:700">' + svT + ': ' + q.dist + ' m</span>&nbsp;de ubic. original</div>';
        }
      }
      ph += coordClickableHTML(q.lat, q.lng);
      if (conBack) ph += '<button type="button" class="pp-back" data-cmd="back"><i class="fa-solid fa-arrow-left"></i> Volver a la lista</button>';
      ph += '</div>';
      return ph;
    }
    /* ★ M2/M4: popup lista de todas las entregas del punto */
    function htmlListaCoincidencias(reg) {
      var nT = {};
      reg.items.forEach(function(it) { nT[it.t.codigo] = true; });
      var tit = (Object.keys(nT).length > 1)
        ? (reg.items.length + ' entregas &middot; ' + Object.keys(nT).length + ' transportes')
        : (reg.items.length + ' entregas en esta ubicaci\u00f3n');
      var h = '<div class="pp" data-reg="' + (reg.idx != null ? reg.idx : '') + '"><div class="pp-num">' + tit + '</div><div class="pp-lista">';
      reg.items.forEach(function(it, ix) {
        var q = it.p, tq = it.t;
        h += '<button type="button" class="pp-item" data-cmd="item" data-ix="' + ix + '">'
          + '<span class="pi-num" style="background:' + tq.color + '">' + (q.pendiente ? '?' : it.num) + '</span>'
          + '<span class="pi-txt"><span class="pi-nombre">' + esc(q.nombre) + '</span>'
          + '<span class="pi-sub">' + (q.pendiente ? 'Pendiente' : esc(cuando(q.hora)))
          + (q.codc ? ' <span class="pi-codc">' + esc(q.codc) + '</span>' : '')
          + ' &middot; <span style="color:' + tq.color + ';font-weight:700">' + esc(tq.codigo) + '</span></span></span></button>';
      });
      h += '</div></div>';
      return h;
    }
    /* ★ M6: registro de coincidentes. La insignia xN ya viene incluida
       en el HTML del divIcon del representante (pre-grupo calculado
       antes de renderizar), y el marcador multipunto ya nace en la
       capa comun con su popup-lista; aqui solo se registran los items
       y se mantiene la coherencia de capas como red de seguridad. */
    function registrarCoincidente(tq, p, num, gapsArr, gOrigen) {
      var k = claveCoinc(p.lat, p.lng);
      if (!COINC_DE[k]) COINC_DE[k] = { lat: p.lat, lng: p.lng, items: [], multipunto: false };
      var reg = COINC_DE[k];
      reg.items.push({ t: tq, p: p, num: num, gapsArr: gapsArr });
      if (reg.items.length === 1) return true;
      if (reg.marker) {
        reg.multipunto = true;
        /* si por cualquier motivo nacio en el grupo de su transporte,
           moverlo a la capa comun */
        if (reg.marker.__grupo && reg.marker.__grupo.hasLayer(reg.marker)) {
          reg.marker.__grupo.removeLayer(reg.marker);
        }
        var gc = groups['__coinc__'];
        if (gc && !gc.hasLayer(reg.marker)) gc.addLayer(reg.marker);
        /* refrescar popup solo si no esta abierto (M5: sin parpadeos) */
        if (!(reg.marker.isPopupOpen && reg.marker.isPopupOpen())) {
          reg.marker.setPopupContent(htmlListaCoincidencias(reg));
        }
      }
      return false;
    }

    /* Banner de frescura: avisa si los datos tienen mas de 10 min */
    function actualizarFrescura(ts) {

    }

    /* ================= ★ P-15: CARGA E INDEXACIÓN DEL PLAN ================= */
    function construirIndicePlan(plan) {
      var idx = { porCliente: {}, porNombre: {}, porRuta: {}, paradas: [] };
      (plan.planes || []).forEach(function(pl) {
        var seq = pl.secuencia || [];
        idx.porRuta[pl.ruta] = seq;
        seq.forEach(function(d) {
          var ent = {
            clnt: d.clnt, codc: d.codc, orden: d.orden, ruta: pl.ruta,
            transporte: pl.transporte, etaTxt: d.etaTxt || '',
            ventanaTxt: d.ventanaTxt || '', ventanaFuente: d.ventanaFuente || '',
            lat: d.lat, lon: d.lon, peso: d.peso, sector: d.sector || '',
            viajes: d.viajes || null
          };
          idx.paradas.push(ent);
          if (d.codc != null && !idx.porCliente[d.codc]) idx.porCliente[d.codc] = ent;
          var nn = normNombre(d.clnt);
          if (nn && !idx.porNombre[nn]) idx.porNombre[nn] = ent;
        });
      });
      return idx;
    }

    function matchParada(p, usados) {
      if (!planIdx) return null;
      var ent = null;
      if (p.codc != null && planIdx.porCliente[p.codc]) ent = planIdx.porCliente[p.codc];
      if (!ent) {
        var nn = normNombre(p.nombre);
        if (nn && planIdx.porNombre[nn]) ent = planIdx.porNombre[nn];
      }
      if (!ent) {
        var bd = 200, best = null;
        for (var i = 0; i < planIdx.paradas.length; i++) {
          var e = planIdx.paradas[i];
          if (usados && usados[e.ruta + '#' + e.orden]) continue;
          if (!isFinite(e.lat) || !isFinite(e.lon) || !isFinite(p.lat) || !isFinite(p.lng)) continue;
          var d = havM(p.lat, p.lng, e.lat, e.lon);
          if (d < bd) { bd = d; best = e; }
        }
        ent = best;
      }
      return ent;
    }

    function computarCruce(transportes) {
      if (!planIdx) return null;
      var res = { porT: {}, global: { ok: 0, fuera: 0, sinPlan: 0, plan: planIdx.paradas.length }, fantasmas: [], fecha: planIdx.fecha };
      var usados = {}, seenRuta = {};
      (transportes || []).forEach(function(t) { res.porT[t.codigo] = { ok: 0, fuera: 0, sinPlan: 0 }; });

      (transportes || []).forEach(function(t) {
        var caps = (t.puntos || []).filter(function(p) { return p && !p.pendiente && p.t != null; });
        caps.sort(function(a, b) { return a.t - b.t; });
        caps.forEach(function(p) {
          p._plan = null; p._planReal = null; p._planT = t.codigo;
          var ent = matchParada(p, usados);
          if (!ent) { res.porT[t.codigo].sinPlan++; res.global.sinPlan++; return; }
          var key = ent.ruta + '#' + ent.orden;
          p._plan = ent;
          if (seenRuta[key]) { res.porT[t.codigo].sinPlan++; res.global.sinPlan++; return; }
          seenRuta[key] = true; usados[key] = true;
        });
      });

      var porRutaReal = {};
      (transportes || []).forEach(function(t) {
        (t.puntos || []).forEach(function(p) {
          if (p && p._plan && !p.pendiente && p.t != null)
            (porRutaReal[p._plan.ruta] = porRutaReal[p._plan.ruta] || []).push(p);
        });
      });
      Object.keys(porRutaReal).forEach(function(r) {
        porRutaReal[r].sort(function(a, b) { return a.t - b.t; });
        porRutaReal[r].forEach(function(p, i) {
          p._planReal = i + 1;
          var pt = res.porT[p._planT];
          if (p._planReal === p._plan.orden) { res.global.ok++; if (pt) pt.ok++; }
          else { res.global.fuera++; if (pt) pt.fuera++; }
        });
      });

      var pendCub = {};
      (transportes || []).forEach(function(t) {
        (t.puntos || []).forEach(function(p) {
          if (!p || !p.pendiente) return;
          var ent = matchParada(p, {});
          if (ent) pendCub[ent.ruta + '#' + ent.orden] = true;
        });
      });

      planIdx.paradas.forEach(function(ent) {
        var key = ent.ruta + '#' + ent.orden;
        if (!usados[key] && !pendCub[key]) res.fantasmas.push(ent);
      });
      return res;
    }

    function cargarPlan() {
      if (!FB_OK) return;
      esperarAuth().then(function(ok) {
        if (!ok) return null;
        return fb.ref('rutas').orderByKey().limitToLast(6).once('value');
      }).then(function(snap) {
        if (!snap) return;
        var rutas = snap.val() || {};
        var keys = Object.keys(rutas).filter(function(f) {
          return /^\d{4}-\d{2}-\d{2}$/.test(f) && rutas[f] && rutas[f].plan;
        }).sort();
        if (!keys.length) return;
        var hoy = hoyISO();
        var pasadas = keys.filter(function(f) { return f <= hoy; });
        var fecha = pasadas.length ? pasadas[pasadas.length - 1] : keys[keys.length - 1];
        var plan = rutas[fecha].plan;
        planIdx = construirIndicePlan(plan);
        planIdx.fecha = fecha;
        planIdx.salida = plan.salidaEstimada || '';
        var b = document.getElementById('btnPlan');
        b.style.display = 'flex';
        b.classList.toggle('on', mostrarPlan);
        if (ultimoPayload && ultimoPayload.transportes) renderDatos(ultimoPayload.transportes);
      }).catch(function(e) { console.error('cargarPlan:', e); });
    }

    function togglePlan() {
      mostrarPlan = !mostrarPlan;
      var b = document.getElementById('btnPlan');
      b.classList.toggle('on', mostrarPlan);
      try { localStorage.setItem('mapa_plan', mostrarPlan ? '1' : '0'); } catch (e) {}
      if (cruceActual) renderPlanOverlay(cruceActual);
    }

    function abrirPlanificador() {
      try { if (planIdx && planIdx.fecha) localStorage.setItem('plan_fecha_sugerida', planIdx.fecha); } catch (e) {}
      window.open('planificador.html', '_blank');
    }

    function renderPlanOverlay(cruce) {
      if (groups['__plan']) { map.removeLayer(groups['__plan']); delete groups['__plan']; }
      if (!cruce || !planIdx || !mostrarPlan) return;
      var g = L.layerGroup();
      Object.keys(planIdx.porRuta).forEach(function(r) {
        var pts = planIdx.porRuta[r].map(function(e) { return [e.lat, e.lon]; });
        if (pts.length > 1) {
          L.polyline(pts, { color: '#8891a8', weight: 2, opacity: .45, dashArray: '3 7', lineCap: 'round' }).addTo(g);
        }
      });
      cruce.fantasmas.forEach(function(ent) {
        var m = L.marker([ent.lat, ent.lon], {
          icon: L.divIcon({ className: 'mk', html: '<div class="mk-plan-dot">' + ent.orden + '</div>', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -14] })
        });
        var ph = '<div class="pp">';
        ph += '<div class="pp-num">Parada planificada &middot; ' + esc(ent.ruta) + ' &middot; ' + esc(ent.transporte) + '</div>';
        ph += '<div class="pp-nombre" style="color:#cbd5e1">' + esc(ent.clnt) + '</div>';
        if (ent.codc) ph += '<div class="pp-row"><i class="fa-solid fa-barcode"></i><span class="pi-codc">' + esc(ent.codc) + '</span></div>';
        if (ent.sector) ph += '<div class="pp-row"><i class="fa-solid fa-tag"></i>' + esc(ent.sector) + '</div>';
        ph += '<div class="pp-row"><i class="fa-solid fa-weight-hanging"></i>' + Math.round(ent.peso).toLocaleString('es-EC') + ' kg</div>';
        ph += '<div class="pp-row"><i class="fa-regular fa-clock"></i>ETA plan ' + esc(ent.etaTxt) + (ent.ventanaTxt ? ' &middot; ventana ' + esc(ent.ventanaTxt) : '') + '</div>';
        if (ent.viajes) ph += '<div class="pp-row"><i class="fa-solid fa-repeat" style="color:#ffd166"></i><span style="color:#ffd166;font-weight:700">' + ent.viajes + ' viajes planificados</span></div>';
        ph += '<div class="pp-row"><i class="fa-solid fa-circle-notch" style="color:#8891a8"></i>Sin captura GPS a\u00fan</div>';
        ph += coordClickableHTML(ent.lat, ent.lon) + '</div>';
        m.bindPopup(ph, { maxWidth: 260 });
        if (ent.sector) m.bindTooltip(esc(ent.sector), { permanent: true, direction: 'right', offset: [12, 0], className: 'lbl-sector', opacity: 1 });
        m.addTo(g);
      });
      groups['__plan'] = g;
      g.addTo(map);
    }

    /* ============================================================
       ★ #1 + M5 — preservación del popup abierto entre renders
       ============================================================ */
    function capturarEstadoVisual() {
      var pop = null;
      Object.keys(groups).forEach(function(k) {
        groups[k].eachLayer(function(l) {
          if (l.isPopupOpen && l.isPopupOpen() && l.getLatLng) {
            pop = { codigo: k, lat: l.getLatLng().lat, lng: l.getLatLng().lng };
            try {
              var pc = l.getPopup();
              pop.html = (pc && pc.getContent) ? pc.getContent() : null;
            } catch (e) { pop.html = null; }
          }
        });
      });
      return pop;
    }
    /* ★ M5: restauración en cascada:
       (a) coordenada exacta en su grupo original,
       (b) misma clave de coincidencia (~11 m) en CUALQUIER grupo —
           cubre los multipunto cuyo marcador representante cambió de
           posición/transporte entre renders. Restaura el HTML capturado;
           si era la lista de un multipunto, se regenera fresca. */
    function restaurarEstadoVisual(pop) {
      if (!pop) return;
      var destino = null;

      /* (a) coordenada exacta en el grupo original */
      if (groups[pop.codigo]) {
        groups[pop.codigo].eachLayer(function(l) {
          if (destino || !l.getLatLng) return;
          if (Math.abs(l.getLatLng().lat - pop.lat) < 1e-7
              && Math.abs(l.getLatLng().lng - pop.lng) < 1e-7) destino = l;
        });
      }

      /* (b) M5: clave de coincidencia en cualquier grupo (multipunto) */
      if (!destino) {
        var kc = claveCoinc(pop.lat, pop.lng);
        Object.keys(groups).forEach(function(k) {
          if (k === '__plan__' || destino) return;
          groups[k].eachLayer(function(l) {
            if (destino || !l.getLatLng || !l.getPopup) return;
            if (l instanceof L.Marker && claveCoinc(l.getLatLng().lat, l.getLatLng().lng) === kc) destino = l;
          });
        });
      }

      if (!destino) return;
      var pc = destino.getPopup();
      if (!pc) { destino.openPopup(); return; }

      if (pop.html && typeof pop.html === 'string' && pop.html.indexOf('pp-lista') === -1) {
        pc.setContent(pop.html);          /* detalles: tal cual estaban */
      } else {
        var reg = null;
        Object.keys(COINC_DE).forEach(function(k2) { if (COINC_DE[k2].marker === destino) reg = COINC_DE[k2]; });
        if (reg && reg.multipunto) pc.setContent(htmlListaCoincidencias(reg));
        else if (pop.html) pc.setContent(pop.html);
      }
      destino.openPopup();
    }

    /* ★ Render de capas: reconstruible sin recrear el mapa (live updates) */
    function renderDatos(transportes) {
      try {
        var popAbierto = capturarEstadoVisual();
        T = transportes || [];
        Object.keys(groups).forEach(function(k) { map.removeLayer(groups[k]); });
        groups = {}; allBounds = [];
        COINC_DE = {}; /* ★ M2: registro de coincidentes del render */
        /* ★ M2: capa comun para marcadores con entregas coincidentes */
        var gCoinc = L.layerGroup();
        groups['__coinc__'] = gCoinc;
        gCoinc.addTo(map);

        var cruce = computarCruce(T);
        cruceActual = cruce;

        var totalPt = 0, nProc = 0, nPen = 0, nGapG = 0, nSinO = 0;
        T.forEach(function(t) {
          totalPt += t.puntos.length;
          if (t.estado === 'en_proceso') nProc++;
          t.puntos.forEach(function(p) {
            if (p.pendiente) nPen++;
            if (p.sinOrigen && !p.pendiente) nSinO++;
          });
        });

        var statsHtml = '<span class="sb-stat s-tr">' + T.length + ' transporte' + (T.length !== 1 ? 's' : '') + '</span>';
        statsHtml += '<span class="sb-stat s-gp">' + totalPt + ' puntos</span>';
        if (nPen > 0) statsHtml += '<span class="sb-stat s-pn">' + nPen + ' pendientes</span>';
        if (nProc > 0) statsHtml += '<span class="sb-stat s-pr">' + nProc + ' activo' + (nProc !== 1 ? 's' : '') + '</span>';
        if (nSinO > 0) statsHtml += '<span class="sb-stat s-so">' + nSinO + ' sin origen</span>';
        if (cruce) {
          var evaluable = cruce.global.ok + cruce.global.fuera;
          statsHtml += '<span class="sb-stat s-plan">Plan ' + fechaCorta(cruce.fecha) + '</span>';
          if (evaluable > 0) {
            var pct = Math.round(cruce.global.ok / evaluable * 100);
            statsHtml += '<span class="sb-stat ' + (pct >= 80 ? 's-plan' : 's-so') + '">' + pct + '% en secuencia</span>';
          }
          if (cruce.fantasmas.length > 0) statsHtml += '<span class="sb-stat s-planb">' + cruce.fantasmas.length + ' sin captura</span>';
        } else if (planIdx) {
          statsHtml += '<span class="sb-stat s-plan">Plan ' + fechaCorta(planIdx.fecha) + '</span>';
        }

        /* ============================================================
           ★ PATCH M6 — PRE-GRUPOS DE COINCIDENTES
           Se registran TODOS los puntos (con su transporte y numero
           cronologico) ANTES de crear ningun marcador. Cada grupo
           sabe desde el inicio cuantas entregas tiene, asi el divIcon
           del representante NACE con su insignia xN — no hay que
           tocar el DOM despues (getElement() devuelve null en el
           primer render porque Leaflet monta los elementos de forma
           diferida; por eso la insignia antes solo aparecia tras
           interactuar o con el siguiente push).
           ============================================================ */
        var PRE_COINC = {};
        T.forEach(function(t) {
          var enRuta0 = t.puntos.filter(function(p) { return !p.pendiente; });
          enRuta0.sort(function(a, b) {
            var ka = (a.t != null) ? a.t : hkey(a.hora);
            var kb = (b.t != null) ? b.t : hkey(b.hora);
            return ka - kb;
          });
          var pend0 = t.puntos.filter(function(p) { return p.pendiente; });
          var seq0 = enRuta0.concat(pend0);
          var c0 = 0;
          seq0.forEach(function(p) {
            var num0 = p.pendiente ? '?' : (++c0);
            var k0 = claveCoinc(p.lat, p.lng);
            if (!PRE_COINC[k0]) PRE_COINC[k0] = { items: [] };
            PRE_COINC[k0].items.push({ t: t, p: p, num: num0 });
          });
        });

        var listHtml = '';
        T.forEach(function(t, idx) {
          var g = L.layerGroup();
          groups[t.codigo] = g;
          if (!ocultos[t.codigo]) g.addTo(map);

          var enRuta = t.puntos.filter(function(p) { return !p.pendiente; });
          var pend = t.puntos.filter(function(p) { return p.pendiente; });
          enRuta.sort(function(a, b) {
            var ka = (a.t != null) ? a.t : hkey(a.hora);
            var kb = (b.t != null) ? b.t : hkey(b.hora);
            return ka - kb;
          });
          var gaps = enRuta.map(function(p, i) {
            if (i === 0 || p.t == null || enRuta[i - 1].t == null) return null;
            return p.t - enRuta[i - 1].t;
          });
          var nGaps = 0;
          gaps.forEach(function(x) { if (x != null && x > U.saltoMin * 60000) nGaps++; });
          nGapG += nGaps;

          var distKm = 0;
          for (var di = 1; di < enRuta.length; di++) {
            var A = enRuta[di - 1], B = enRuta[di];
            var dLa = (B.lat - A.lat) * Math.PI / 180, dLo = (B.lng - A.lng) * Math.PI / 180;
            var hA = Math.sin(dLa / 2) * Math.sin(dLa / 2)
                   + Math.cos(A.lat * Math.PI / 180) * Math.cos(B.lat * Math.PI / 180) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
            distKm += 2 * 6371000 * Math.atan2(Math.sqrt(hA), Math.sqrt(1 - hA));
          }
          distKm = Math.round(distKm / 100) / 10;

          var tActual = tActualDe(t);

          var rc = cruce ? cruce.porT[t.codigo] : null;
          var metaPlan = '';
          if (rc && (rc.ok + rc.fuera) > 0) {
            metaPlan = ' &middot; <span style="color:#5eead4;font-weight:700">plan ' + rc.ok + '/' + (rc.ok + rc.fuera) + '</span>';
            if (rc.fuera > 0) metaPlan += ' <span style="color:#f87171;font-weight:700">' + rc.fuera + ' fuera</span>';
          }

          /* ============================================================
             ★ M2/M4/M5/M6 — render de puntos con agrupamiento
             ============================================================ */
          var seq = enRuta.concat(pend);
          var coords = [], nPenT = 0;

          seq.forEach(function(p, i) {
            var esPen = !!p.pendiente;
            if (esPen) nPenT++;
            var col = t.color;
            var num = esPen ? '?' : (coords.length + 1);
            p._gIdx = esPen ? null : coords.length;

            /* desviacion por punto (linea + circulo original), aunque este agrupado */
            if (!esPen && p.dist !== '' && p.dist != null && isFinite(p.dist) && p.latO != null) {
              var sv = p.dist < U.desvOk ? '#34d399' : (p.dist < U.desvAl ? '#fbbf24' : '#f87171');
              L.polyline([[p.latO, p.lngO], [p.lat, p.lng]], { color: sv, weight: 2, opacity: .85, dashArray: '4 4' }).addTo(g);
              var oc = L.circleMarker([p.latO, p.lngO], { radius: 5, color: sv, weight: 2, fill: false }).addTo(g);
              oc.bindPopup('<div class="pp"><div class="pp-num">Ubicacion original</div><div class="pp-nombre" style="color:' + sv + '">' + esc(p.nombre) + '</div>' + coordClickableHTML(p.latO, p.lngO) + '<div class="pp-row"><i class="fa-solid fa-arrows-left-right"></i>' + p.dist + ' m del punto capturado</div></div>');
            }

            var esActual = (!esPen && !p.sinOrigen && tActual != null && p.t === tActual);
            var esFuera = (p._plan && p._planReal != null && p._planReal !== p._plan.orden);
            var clsExtra = (p.sinOrigen ? ' mk-sin-origen' : '')
                         + (esActual ? ' mk-actual' : '')
                         + (esFuera ? ' mk-fuera' : '');

            /* ★ M6: pre-grupo de este punto — el representante nace
               con la insignia xN en su propio HTML */
            var pre = PRE_COINC[claveCoinc(p.lat, p.lng)];
            var esRepr = !pre || pre.items[0].p === p;
            var badgeN = (pre && pre.items.length > 1 && esRepr)
              ? '<span class="mk-n" title="' + pre.items.length + ' entregas en este punto">\u00d7' + pre.items.length + '</span>'
              : '';

            var icon = L.divIcon({
              className: 'mk' + clsExtra,
              html: '<div class="mk-dot" style="background:' + col + ';' + (esPen ? 'border-style:dashed;' : '') + '">' + num + badgeN + '</div>',
              iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
            });

            var crear = registrarCoincidente(t, p, num, gaps, g);
            if (crear) {
              var k = claveCoinc(p.lat, p.lng);
              var reg = COINC_DE[k];
              var m = L.marker([p.lat, p.lng], { icon: icon });
              reg.marker = m;
              reg.multipunto = !!(pre && pre.items.length > 1); /* nace multipunto si aplica */
              m.__grupo = g;
              if (reg.multipunto) {
                /* ★ M6: nace directo en la capa comun con popup-lista */
                m.bindPopup(htmlListaCoincidencias(reg), { maxWidth: 280, autoPan: { duration: 0.15 } });
                var gc0 = groups['__coinc__'];
                if (gc0) gc0.addLayer(m); else m.addTo(g);
              } else {
                m.bindPopup(construirDetallesG(t, p, num, gaps), { maxWidth: 260, autoPan: { duration: 0.15 } });
                m.addTo(g);
              }
              if (p.sector) {
                m.bindTooltip(esc(p.sector), { permanent: true, direction: 'right', offset: [13, 0], className: 'lbl-sector', opacity: 1 });
              }
            }
            if (!esPen) coords.push([p.lat, p.lng]);
            allBounds.push([p.lat, p.lng]);
          });

          /* segmentos consecutivos (incluye puntos de primera captura sin origen) */
          for (var si = 1; si < enRuta.length; si++) {
            var pa = enRuta[si - 1], pb = enRuta[si], gMs = gaps[si];
            var esSalto = (gMs != null && gMs > U.saltoMin * 60000);
            var seg;
            if (esSalto) {
              seg = L.polyline([[pa.lat, pa.lng], [pb.lat, pb.lng]], { color: '#f87171', weight: 4, opacity: .9, dashArray: '2 9', lineCap: 'round' });
              seg.options.alerta = true;
              var gm = L.marker([(pa.lat + pb.lat) / 2, (pa.lng + pb.lng) / 2], {
                icon: L.divIcon({
                  className: 'mk',
                  html: '<div class="mk-gap" title="Salto temporal"><i class="fa-solid fa-triangle-exclamation"></i></div>',
                  iconSize: [26, 26], iconAnchor: [13, 13]
                })
              });
              gm.bindPopup('<div class="pp"><div class="pp-num">Salto temporal &middot; ' + esc(t.codigo) + '</div><div class="pp-nombre" style="color:#f87171">Sin capturas durante ' + fmtDur(Math.round(gMs / 60000)) + '</div><div class="pp-row"><i class="fa-regular fa-clock"></i>De ' + esc(cuando(pa.hora)) + ' a ' + esc(cuando(pb.hora)) + '</div><div class="pp-row"><i class="fa-solid fa-route"></i>Punto ' + si + ' &rarr; Punto ' + (si + 1) + '</div></div>');
              gm.addTo(g);
            } else {
              seg = L.polyline([[pa.lat, pa.lng], [pb.lat, pb.lng]], { color: t.color, weight: 3.5, opacity: 0.5, lineJoin: 'round', lineCap: 'round' });
            }
            seg.addTo(g);
          }

          var ec = t.estado === 'en_proceso' ? 'bp' : 'bc';
          var et = t.estado === 'en_proceso' ? 'En proceso' : 'Completado';
          var estaOculto = !!ocultos[t.codigo];
          listHtml += '<div class="sb-item" data-cod="' + esc(t.codigo) + '">';
          listHtml += '<div class="sb-bar" style="background:' + t.color + '"></div>';
          listHtml += '<div class="sb-content"><div class="sb-top"><span class="sb-codigo" style="color:' + t.color + '">' + esc(t.codigo) + '</span><span class="sb-badge ' + ec + '">' + et + '</span></div>';
          listHtml += '<div class="sb-meta"><i class="fa-solid fa-location-dot"></i>' + t.puntos.length + ' puntos' + (nPenT > 0 ? ' &middot; ' + nPenT + ' pend.' : '') + (distKm > 0 ? ' &middot; <i class="fa-solid fa-road"></i>' + distKm + ' km' : '') + (nGaps > 0 ? ' &middot; <span style="color:#f87171;font-weight:700">' + nGaps + ' salto' + (nGaps !== 1 ? 's' : '') + ' &gt;' + U.saltoMin + ' min</span>' : '') + (t.inact != null ? ' &middot; <span style="color:' + (t.inact < U.inactOk ? '#34d399' : (t.inact < U.inactAl ? '#fbbf24' : '#f87171')) + ';font-weight:700">inactivo ' + fmtDur(t.inact) + '</span>' : '') + metaPlan + '</div></div>';
          listHtml += '<button class="sb-eye' + (estaOculto ? ' off' : '') + '" data-cod="' + esc(t.codigo) + '" title="Mostrar/ocultar"><i class="fa-solid fa-' + (estaOculto ? 'eye-slash' : 'eye') + '"></i></button></div>';
        });

        if (nGapG > 0) statsHtml += '<span class="sb-stat s-gap">' + nGapG + ' salto' + (nGapG !== 1 ? 's' : '') + ' &gt;' + U.saltoMin + ' min</span>';
        document.getElementById('sbStats').innerHTML = statsHtml;
        document.getElementById('sbList').innerHTML = listHtml;

        document.querySelectorAll('.sb-item').forEach(function(el) {
          el.classList.toggle('active', el.getAttribute('data-cod') === codigoActivo);
        });

        Object.keys(ocultos).forEach(function(k) { if (k !== '__coinc__' && !groups[k]) delete ocultos[k]; });
        try { localStorage.setItem('mapa_ocultos', JSON.stringify(ocultos)); } catch (e) {}

        if (!yaFit && allBounds.length > 0) {
          map.fitBounds(L.latLngBounds(allBounds), { padding: [40, 40], maxZoom: 16 });
          yaFit = true;
        }
        /* ★ M4+M5+M6: indices vigentes (y listas finales de los
           multipunto, que nacieron con 1 item registrado), visibilidad
           de agrupados y restaurar el popup abierto tal cual estaba */
        reconstruirCoincList();
        actualizarVisibilidadCoinc();
        restaurarEstadoVisual(popAbierto);

        renderPlanOverlay(cruce);
      } catch (e) {
        console.error(e);
        document.getElementById('sbStats').innerHTML = '<span class="sb-stat s-pr" style="max-width:280px">Error: ' + esc(e.message) + '</span>';
      }
    }

    function aplicarPayload(p) {
      if (!p) return;
      ultimoPayload = p;
      if (p.umbrales) U = p.umbrales;
      document.getElementById('sbTitulo').textContent = p.subtitulo || 'Mapa';
      document.title = p.titulo || 'Mapa de monitoreo';
      actualizarFrescura(p.ts);
      renderDatos(p.transportes);
    }

    function sinDatos() {
      document.getElementById('sinDatos').style.display = 'flex';
      document.getElementById('sidebar').style.display = 'none';
    }

    window.addEventListener('message', function(e) {
      var d = e.data;
      if (d && d.__mapaDatos) {
        delete d.__mapaDatos;
        aplicarPayload(d);
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      initMapa();
      var raw = null;
      try { raw = localStorage.getItem('pm_mapa_datos'); } catch (e) {}
      if (raw) {
        try {
          var p = JSON.parse(raw);
          if (p && p.transportes && p.transportes.length) {
            aplicarPayload(p);
            if (window.opener && !window.opener.closed) {
              try { window.opener.postMessage({ __mapaListo: true }, '*'); } catch (e) {}
            }
          } else {
            sinDatos();
          }
        } catch (e) { sinDatos(); }
      } else {
        sinDatos();
      }
      cargarPlan();
      setInterval(function() {
        try {
          var raw2 = localStorage.getItem('pm_mapa_datos');
          if (raw2) { var p2 = JSON.parse(raw2); if (p2 && p2.ts) actualizarFrescura(p2.ts); }
        } catch (e) {}
      }, 60000);
      setInterval(function() {
        if (!ultimoPayload || !ultimoPayload.transportes) return;
        var cambio = false;
        ultimoPayload.transportes.forEach(function(t) {
          if (t.estado !== 'en_proceso') return;
          var maxT = 0;
          t.puntos.forEach(function(p) { if (!p.pendiente && p.t != null && p.t > maxT) maxT = p.t; });
          if (maxT) {
            var nuevoInact = Math.max(0, Math.floor((Date.now() - maxT) / 60000));
            if (nuevoInact !== t.inact) { t.inact = nuevoInact; cambio = true; }
          }
        });
        if (cambio) renderDatos(ultimoPayload.transportes);
      }, 60000);
    });

    function toggleEtiquetas() {
      etiquetasOn = !etiquetasOn;
      document.body.classList.toggle('sin-etiquetas', !etiquetasOn);
      var b = document.getElementById('btnEtiquetas');
      b.classList.toggle('on', etiquetasOn);
      b.innerHTML = '<i class="fa-solid fa-tags"></i> Sectores';
      try { localStorage.setItem('mapa_etiquetas', etiquetasOn ? '1' : '0'); } catch (e) {}
    }

    /* ===== INTERACCIONES SIDEBAR ===== */
    function zoomT(c) {
      var g = groups[c];
      if (!g) return;
      codigoActivo = c;
      var b = [];
      g.eachLayer(function(l) { if (l.getLatLng) b.push(l.getLatLng()); });
      Object.keys(COINC_DE).forEach(function(k) {
        var reg = COINC_DE[k];
        if (reg.marker && reg.items.some(function(it) { return it.t.codigo === c; })) b.push(reg.marker.getLatLng());
      });
      if (b.length) map.fitBounds(L.latLngBounds(b), { padding: [50, 50], maxZoom: 17 });
      document.querySelectorAll('.sb-item').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-cod') === c);
      });
    }

    function bindList() {
      var el = document.getElementById('sbList');
      el.addEventListener('click', function(e) {
        var eye = e.target.closest('.sb-eye');
        if (eye) { e.stopPropagation(); togVis(eye.getAttribute('data-cod'), eye); return; }
        var it = e.target.closest('.sb-item');
        if (it) zoomT(it.getAttribute('data-cod'));
      });
      el.addEventListener('mouseover', function(e) {
        var it = e.target.closest('.sb-item');
        if (it && !it.contains(e.relatedTarget)) hlT(it.getAttribute('data-cod'));
      });
      el.addEventListener('mouseout', function(e) {
        var it = e.target.closest('.sb-item');
        if (it && !it.contains(e.relatedTarget)) uhlT(it.getAttribute('data-cod'));
      });
    }

    function hlT(c) {
      var g = groups[c];
      if (g) g.eachLayer(function(l) {
        if (l instanceof L.Polyline) l.setStyle({ weight: 7, opacity: 1 });
        if (l instanceof L.Marker) {
          var el = l.getElement();
          if (el) { var d = el.querySelector('.mk-dot'); if (d) d.classList.add('hl'); }
        }
      });
      Object.keys(COINC_DE).forEach(function(k) {
        var reg = COINC_DE[k];
        if (!reg.marker || !reg.items.some(function(it) { return it.t.codigo === c; })) return;
        var el = reg.marker.getElement();
        if (el) { var d = el.querySelector('.mk-dot'); if (d) d.classList.add('hl'); }
      });
    }

    function uhlT(c) {
      var g = groups[c];
      if (g) g.eachLayer(function(l) {
        if (l instanceof L.Polyline) l.setStyle(l.options.alerta ? { weight: 4, opacity: .9 } : { weight: 3.5, opacity: 0.5 });
        if (l instanceof L.Marker) {
          var el = l.getElement();
          if (el) { var d = el.querySelector('.mk-dot'); if (d) d.classList.remove('hl'); }
        }
      });
      Object.keys(COINC_DE).forEach(function(k) {
        var reg = COINC_DE[k];
        if (!reg.marker || !reg.items.some(function(it) { return it.t.codigo === c; })) return;
        var el = reg.marker.getElement();
        if (el) { var d = el.querySelector('.mk-dot'); if (d) d.classList.remove('hl'); }
      });
    }

    /* ★ M2: visibilidad de marcadores agrupados segun transportes visibles */
    function actualizarVisibilidadCoinc() {
      var gc = groups['__coinc__'];
      if (!gc) return;
      Object.keys(COINC_DE).forEach(function(k) {
        var reg = COINC_DE[k];
        if (!reg.marker || !reg.multipunto) return;
        var visible = reg.items.some(function(it) { return groups[it.t.codigo] && map.hasLayer(groups[it.t.codigo]); });
        if (visible && !gc.hasLayer(reg.marker)) gc.addLayer(reg.marker);
        if (!visible && gc.hasLayer(reg.marker)) gc.removeLayer(reg.marker);
      });
    }

    function togVis(c, btn) {
      var g = groups[c];
      if (!g) return;
      if (map.hasLayer(g)) {
        map.removeLayer(g);
        ocultos[c] = true;
        btn.classList.add('off');
        btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
      } else {
        g.addTo(map);
        delete ocultos[c];
        btn.classList.remove('off');
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
      }
      try { localStorage.setItem('mapa_ocultos', JSON.stringify(ocultos)); } catch (e) {}
      actualizarVisibilidadCoinc();
    }

    function fitAll() {
      var b = [];
      Object.keys(groups).forEach(function(k) {
        if (k === '__coinc__' || k === '__plan__') return;
        if (!map.hasLayer(groups[k])) return;
        groups[k].eachLayer(function(l) { if (l.getLatLng) b.push(l.getLatLng()); });
      });
      Object.keys(COINC_DE).forEach(function(k) {
        var reg = COINC_DE[k];
        if (!reg.marker) return;
        var visible = reg.items.some(function(it) { return groups[it.t.codigo] && map.hasLayer(groups[it.t.codigo]); });
        if (visible) b.push(reg.marker.getLatLng());
      });
      if (b.length) map.fitBounds(L.latLngBounds(b), { padding: [40, 40], maxZoom: 16 });
    }
  </script>
</body>
